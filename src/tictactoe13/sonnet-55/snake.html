<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snake 3D - stile Minecraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --font: 'Press Start 2P', 'Courier New', monospace; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #c4e0f7;
    font-family: var(--font); color: #fff;
    user-select: none; -webkit-user-select: none;
  }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas#c.drag { cursor: grabbing; }

  .hud { position: fixed; pointer-events: none; }
  .panel {
    background: rgba(0, 0, 0, .55); border: 3px solid #000;
    box-shadow: inset 2px 2px 0 rgba(255, 255, 255, .25), inset -2px -2px 0 rgba(0, 0, 0, .4);
    padding: 10px 14px;
  }

  #title {
    top: 12px; left: 50%; transform: translateX(-50%);
    font-size: clamp(24px, 5vw, 46px); letter-spacing: 6px; white-space: nowrap;
    color: #f2f2f2; text-shadow: 4px 4px 0 #3b3b3b;
  }
  #title .a { color: #6ee05a; } #title .b { color: #3fb04a; }

  #status {
    top: calc(clamp(24px, 5vw, 46px) + 34px); left: 50%; transform: translateX(-50%);
    font-size: clamp(9px, 1.7vw, 13px); text-align: center; white-space: nowrap;
    text-shadow: 2px 2px 0 #222;
  }
  #status.win  { color: #7dff7d; }
  #status.lose { color: #ff7d6e; }
  #status.gold { color: #ffe27d; }

  #score { top: 12px; left: 12px; font-size: 10px; line-height: 2; text-shadow: 2px 2px 0 #222; }
  #score .k { color: #aaa; }
  #score .p { color: #ffe27d; }

  #controls {
    bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;
    pointer-events: auto; width: max-content; max-width: 96vw;
  }
  .mc-btn {
    font-family: var(--font); font-size: 11px; color: #fff; background: #8b8b8b;
    border: 3px solid #000; padding: 10px 12px; cursor: pointer; text-shadow: 2px 2px 0 #3f3f3f;
    box-shadow: inset 3px 3px 0 #c6c6c6, inset -3px -3px 0 #555; border-radius: 0;
  }
  .mc-btn:hover { background: #7d89cf; box-shadow: inset 3px 3px 0 #b8c1f5, inset -3px -3px 0 #4a528a; }
  .mc-btn:active { transform: translateY(2px); }
  .mc-btn.pulse { animation: pulse 1s steps(2) infinite; }
  @keyframes pulse { 50% { background: #5fbf4f; box-shadow: inset 3px 3px 0 #9be68c, inset -3px -3px 0 #347a29; } }
  select.mc-btn { appearance: none; -webkit-appearance: none; }
  select.mc-btn option { background: #555; color: #fff; }

  #hint { bottom: 76px; left: 50%; transform: translateX(-50%); font-size: 8px; opacity: .9;
          text-shadow: 1px 1px 0 #000; white-space: nowrap; }

  #dpad {
    display: none; right: 12px; bottom: 84px; pointer-events: auto;
    grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 54px); gap: 4px;
  }
  #dpad .mc-btn { width: 54px; height: 54px; padding: 0; font-size: 18px; }
  #dpad [data-d=up] { grid-area: 1 / 2; } #dpad [data-d=left] { grid-area: 2 / 1; }
  #dpad [data-d=right] { grid-area: 2 / 3; } #dpad [data-d=down] { grid-area: 3 / 2; }
  @media (pointer: coarse) { #dpad { display: grid; } #hint { display: none; } }
  @media (max-width: 640px) { #hint { display: none; } #score { font-size: 8px; } .mc-btn { font-size: 9px; padding: 8px 9px; } }

  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    background: #6b4a2b; color: #fff; font-size: 14px; line-height: 2; z-index: 10; padding: 20px;
    text-shadow: 2px 2px 0 #000; transition: opacity .5s;
  }
  #loading.done { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title" class="hud"><span class="a">SN</span><span class="b">AK</span><span class="a">E</span></div>
<div id="status" class="hud panel">...</div>
<div id="score" class="hud panel">
  <div><span class="k">PUNTI</span> <b class="p" id="sScore">0</b></div>
  <div><span class="k">RECORD</span> <b id="sBest">0</b></div>
  <div><span class="k">LUNGHEZZA</span> <b id="sLen">3</b></div>
</div>
<div id="hint" class="hud">Frecce / WASD: muovi &middot; Spazio / P: pausa &middot; Trascina: ruota &middot; Rotella: zoom &middot; R: nuova &middot; M: suono</div>
<div id="dpad" class="hud">
  <button class="mc-btn" data-d="up">^</button>
  <button class="mc-btn" data-d="left">&lt;</button>
  <button class="mc-btn" data-d="right">&gt;</button>
  <button class="mc-btn" data-d="down">v</button>
</div>
<div id="controls" class="hud">
  <select id="speed" class="mc-btn" title="Velocita">
    <option value="200">Lento</option>
    <option value="150" selected>Normale</option>
    <option value="105">Veloce</option>
  </select>
  <button id="btnPause" class="mc-btn">Pausa</button>
  <button id="btnNew" class="mc-btn">Nuova partita</button>
  <button id="btnMute" class="mc-btn">Suono: SI</button>
</div>
<div id="loading">Generazione del mondo...</div>

<script type="module">
const $ = s => document.querySelector(s);

let THREE;
try {
  THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
} catch (err) {
  $('#loading').innerHTML = 'Impossibile caricare three.js dal CDN.<br>Controlla la connessione e ricarica la pagina.';
  throw err;
}

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const now = () => performance.now() / 1000;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ------------------------------------------------------------------ */
/*  Audio sintetizzato (Web Audio)                                    */
/* ------------------------------------------------------------------ */
let actx = null, master = null, noiseBuf = null, muted = false;

function ensureAudio() {
  try {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = muted ? 0 : 0.55;
      master.connect(actx.destination);
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (actx.state === 'suspended') actx.resume();
    return true;
  } catch (e) { return false; }
}

function tone(f, dur, { type = 'square', vol = 0.15, to = null, delay = 0 } = {}) {
  if (!actx) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + dur + 0.03);
}

function noise(dur, { freq = 800, to = null, vol = 0.3, delay = 0, type = 'lowpass' } = {}) {
  if (!actx) return;
  const t = actx.currentTime + delay;
  const src = actx.createBufferSource();
  src.buffer = noiseBuf; src.loop = true;
  const flt = actx.createBiquadFilter();
  flt.type = type;
  flt.frequency.setValueAtTime(freq, t);
  if (to) flt.frequency.exponentialRampToValueAtTime(to, t + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(flt).connect(g).connect(master);
  src.start(t); src.stop(t + dur + 0.03);
}

const sfx = {
  ui()    { tone(520, 0.06, { vol: 0.07 }); tone(780, 0.07, { vol: 0.06, delay: 0.05 }); },
  turn()  { tone(320, 0.035, { type: 'triangle', vol: 0.035, to: 260 }); },
  eat() {                                              // crunch + blip
    noise(0.07, { freq: 2600, type: 'highpass', vol: 0.3 });
    tone(520 + Math.random() * 120, 0.1, { type: 'triangle', vol: 0.14, to: 1250 });
  },
  gold() {
    noise(0.07, { freq: 3000, type: 'highpass', vol: 0.25 });
    [659, 784, 988, 1319, 1568].forEach((f, i) => tone(f, 0.14, { vol: 0.09, delay: i * 0.06 }));
  },
  bonusSpawn() { tone(988, 0.1, { type: 'triangle', vol: 0.1 }); tone(1319, 0.2, { type: 'triangle', vol: 0.1, delay: 0.1 }); },
  bonusMiss()  { tone(330, 0.2, { type: 'triangle', vol: 0.09, to: 140 }); },
  start() { tone(392, 0.09, { vol: 0.08 }); tone(523, 0.09, { vol: 0.08, delay: 0.09 }); tone(659, 0.14, { vol: 0.08, delay: 0.18 }); },
  pause() { tone(440, 0.07, { vol: 0.07 }); tone(330, 0.1, { vol: 0.07, delay: 0.07 }); },
  resume() { tone(330, 0.07, { vol: 0.07 }); tone(440, 0.1, { vol: 0.07, delay: 0.07 }); },
  die() {
    noise(0.15, { freq: 400, to: 120, vol: 0.5 });                                 // impatto
    [392, 330, 262, 196].forEach((f, i) => tone(f, 0.26, { type: 'sawtooth', vol: 0.09, delay: 0.1 + i * 0.2 }));
    noise(0.2, { freq: 3000, type: 'highpass', vol: 0.12, delay: 0.7 });           // sfrigolio
    noise(0.7, { freq: 900, to: 60, vol: 0.9, delay: 0.95 });                      // boom
    tone(70, 0.6, { type: 'sine', vol: 0.5, to: 30, delay: 0.95 });
  },
  win() {
    [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, { vol: 0.12, delay: i * 0.12 }));
    [523, 659, 784, 1047].forEach(f => tone(f, 0.7, { type: 'triangle', vol: 0.09, delay: 0.5 }));
  },
  record() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.18, { type: 'triangle', vol: 0.1, delay: i * 0.1 })); },
};

/* ------------------------------------------------------------------ */
/*  Renderer / scena                                                  */
/* ------------------------------------------------------------------ */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

const HORIZON = 0xc4e0f7;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(HORIZON, 42, 90);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 600);

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(300, 24, 12),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x4f8fe0) }, hor: { value: new THREE.Color(HORIZON) } },
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 hor; varying vec3 vP; void main(){ float h = normalize(vP).y; float t = pow(clamp(h, 0.0, 1.0), 0.55); gl_FragColor = vec4(mix(hor, top, t), 1.0);\n#include <colorspace_fragment>\n}',
  })
);
sky.renderOrder = -2; sky.frustumCulled = false;
scene.add(sky);

const sunDir = new THREE.Vector3(-0.45, 0.55, 0.6).normalize();
scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x8a7a5a, 1.5));
const sun = new THREE.DirectionalLight(0xfff0d0, 2.4);
sun.position.copy(sunDir).multiplyScalar(45);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 110 });
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const sunDisc = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshBasicMaterial({ color: 0xfff3b0, fog: false }));
sunDisc.frustumCulled = false;
scene.add(sunDisc);

/* ------------------------------------------------------------------ */
/*  Texture procedurali 16x16 stile pixel-art                         */
/* ------------------------------------------------------------------ */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function makeTex(seed, fn) {
  const r = mulberry32(seed);
  const c = document.createElement('canvas');
  c.width = c.height = 16;
  const g = c.getContext('2d');
  const img = g.createImageData(16, 16);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const [R, G, B, A = 255] = fn(x, y, r);
    const k = (y * 16 + x) * 4;
    img.data[k] = clamp(R, 0, 255); img.data[k + 1] = clamp(G, 0, 255);
    img.data[k + 2] = clamp(B, 0, 255); img.data[k + 3] = A;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestMipmapLinearFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
const vary = (base, amt, r, f = 1) => { const k = f * (1 + (r() - 0.5) * amt); return [base[0] * k, base[1] * k, base[2] * k]; };
const edgeOf = (x, y) => (x === 0 || y === 0 || x === 15 || y === 15);
const inBox = (x, y, x0, y0, x1, y1) => x >= x0 && x <= x1 && y >= y0 && y <= y1;

const GRASS = [88, 150, 52], DIRT = [134, 96, 67];
const grassLens = Array.from({ length: 16 }, (_, i) => 3 + Math.floor(mulberry32(i * 77 + 5)() * 3));
const SNAKE = [64, 170, 74];

const T = {
  grassTop: makeTex(1, (x, y, r) => vary(GRASS, 0.35, r)),
  dirt: makeTex(2, (x, y, r) => vary(DIRT, 0.4, r, r() < 0.1 ? 0.72 : 1)),
  grassSide: makeTex(3, (x, y, r) => y < grassLens[x] ? vary(GRASS, 0.35, r) : vary(DIRT, 0.4, r, r() < 0.1 ? 0.72 : 1)),
  stone: makeTex(4, (x, y, r) => vary([126, 126, 126], 0.28, r, r() < 0.1 ? 0.75 : 1)),
  sand: makeTex(5, (x, y, r) => vary([219, 207, 142], 0.12, r)),
  logSide: makeTex(6, (x, y, r) => vary([104, 82, 50], 0.18, r, x % 4 === 0 ? 0.8 : 1)),
  logTop: makeTex(7, (x, y, r) => {
    const d = Math.max(Math.abs(x - 7.5), Math.abs(y - 7.5));
    if (d > 6.9) return vary([104, 82, 50], 0.15, r);
    return vary(Math.floor(d) % 2 ? [172, 138, 86] : [140, 110, 66], 0.12, r);
  }),
  leaves: makeTex(8, (x, y, r) => {
    const a = r() < 0.14 ? 0 : 255;
    return [...vary([50, 124, 40], 0.55, r), a];
  }),
  water: makeTex(9, (x, y, r) => {
    const streak = ((x * 3 + y * 5) % 11 === 0) || ((x + y * 2) % 13 === 0);
    return streak ? vary([110, 160, 240], 0.15, r) : vary([36, 88, 200], 0.15, r);
  }),
  brick: makeTex(10, (x, y, r) => {
    const off = ((y >> 2) % 2) * 4;
    const mortar = (y % 4 === 3) || ((x + off) % 8 === 7);
    return mortar ? vary([72, 72, 72], 0.2, r) : vary([130, 130, 130], 0.25, r);
  }),
  apple: makeTex(11, (x, y, r) => {
    if ((x === 3 || x === 4) && (y === 3 || y === 4) && !(x === 4 && y === 4)) return [255, 170, 160];
    return vary([210, 40, 36], 0.25, r, edgeOf(x, y) ? 0.7 : (r() < 0.08 ? 0.75 : 1));
  }),
  gold: makeTex(12, (x, y, r) => r() < 0.1 ? [255, 255, 235] : vary([250, 204, 46], 0.2, r, edgeOf(x, y) ? 0.82 : 1)),
  snakeBody: makeTex(13, (x, y, r) => vary(SNAKE, 0.15, r, ((x + y) % 4 === 0 ? 0.82 : 1) * (edgeOf(x, y) ? 0.85 : 1))),
  snakeHead: makeTex(14, (x, y, r) => vary([76, 188, 84], 0.12, r, edgeOf(x, y) ? 0.85 : 1)),
  snakeFace: makeTex(15, (x, y, r) => {
    if (inBox(x, y, 3, 4, 5, 7) || inBox(x, y, 10, 4, 12, 7)) {                      // occhi
      const pupil = inBox(x, y, 4, 5, 5, 7) || inBox(x, y, 11, 5, 12, 7);
      return pupil ? [10, 10, 10] : [245, 245, 245];
    }
    if (inBox(x, y, 7, 10, 8, 15)) return [225, 40, 60];                              // lingua
    if (inBox(x, y, 4, 9, 11, 9)) return [30, 70, 34];                                // bocca
    return vary([76, 188, 84], 0.12, r, edgeOf(x, y) ? 0.85 : 1);
  }),
};
T.water.wrapS = T.water.wrapT = THREE.RepeatWrapping; T.water.repeat.set(600, 600);

const lam = (map, extra = {}) => new THREE.MeshLambertMaterial({ map, ...extra });

/* ------------------------------------------------------------------ */
/*  Mondo voxel                                                       */
/* ------------------------------------------------------------------ */
const HALF = 44;
const SEA = -2;
const SEED = 20260;
const FLAT_R = 12;    // raggio della piattaforma piatta attorno all'arena

function hash(x, z) {
  let h = Math.imul(x, 374761393) + Math.imul(z, 668265263) + SEED;
  h = Math.imul(h ^ h >>> 13, 1274126177);
  return ((h ^ h >>> 16) >>> 0) / 4294967296;
}
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function heightAt(x, z) {
  const n = 0.55 * vnoise(x / 10, z / 10) + 0.3 * vnoise(x / 4.5 + 50, z / 4.5) + 0.15 * vnoise(x / 2 + 9, z / 2 - 30);
  let h = n * 11 - 4.5;
  const t = clamp((Math.hypot(x, z) - FLAT_R) / 9, 0, 1);
  h *= t * (1 + 0.6 * t);
  const e = clamp((Math.max(Math.abs(x), Math.abs(z)) - (HALF - 12)) / 10, 0, 1);
  h = h * (1 - e) + (-5) * e;
  return Math.round(h);
}

const lists = { grass: [], dirt: [], sand: [], stone: [], log: [], leaf: [] };
for (let x = -HALF; x <= HALF; x++) for (let z = -HALF; z <= HALF; z++) {
  const h = heightAt(x, z);
  const minN = Math.min(heightAt(x + 1, z), heightAt(x - 1, z), heightAt(x, z + 1), heightAt(x, z - 1));
  const lo = Math.min(minN + 1, h);
  for (let y = h; y >= lo; y--) {
    let type;
    if (h <= -1) type = 'sand';
    else if (y === h) type = 'grass';
    else type = y >= h - 2 ? 'dirt' : 'stone';
    lists[type].push([x, y, z]);
  }
}

const rng = mulberry32(4242);
const trees = [];
for (let x = -HALF + 4; x <= HALF - 4; x++) for (let z = -HALF + 4; z <= HALF - 4; z++) {
  if (Math.hypot(x, z) < FLAT_R + 3) continue;
  const h = heightAt(x, z);
  if (h < 0 || h > 4 || rng() > 0.022) continue;
  if (trees.some(t => Math.hypot(t[0] - x, t[1] - z) < 4)) continue;
  trees.push([x, z]);
  const th = 4 + Math.floor(rng() * 2);
  for (let y = 1; y <= th; y++) lists.log.push([x, h + y, z]);
  for (let dy = th - 1; dy <= th + 1; dy++) {
    const rad = dy === th + 1 ? 1 : 2;
    for (let dx = -rad; dx <= rad; dx++) for (let dz = -rad; dz <= rad; dz++) {
      if (dx === 0 && dz === 0 && dy <= th) continue;
      if (Math.abs(dx) === 2 && Math.abs(dz) === 2 && rng() < 0.6) continue;
      lists.leaf.push([x + dx, h + dy, z + dz]);
    }
  }
}

function makeInst(geo, mat, list, shadow = true) {
  if (!list.length) return null;
  const m = new THREE.InstancedMesh(geo, mat, list.length);
  const d = new THREE.Object3D();
  list.forEach((p, i) => { d.position.set(p[0], p[1], p[2]); d.updateMatrix(); m.setMatrixAt(i, d.matrix); });
  m.instanceMatrix.needsUpdate = true;
  m.castShadow = shadow; m.receiveShadow = true;
  scene.add(m);
  return m;
}
const blockGeo = new THREE.BoxGeometry(1, 1, 1);
const mDirt = lam(T.dirt);
makeInst(blockGeo, [lam(T.grassSide), lam(T.grassSide), lam(T.grassTop), mDirt, lam(T.grassSide), lam(T.grassSide)], lists.grass);
makeInst(blockGeo, mDirt, lists.dirt);
makeInst(blockGeo, lam(T.sand), lists.sand);
makeInst(blockGeo, lam(T.stone), lists.stone);
makeInst(blockGeo, [lam(T.logSide), lam(T.logSide), lam(T.logTop), lam(T.logTop), lam(T.logSide), lam(T.logSide)], lists.log);
makeInst(blockGeo, lam(T.leaves, { alphaTest: 0.5 }), lists.leaf);

// fiori
{
  const fr = mulberry32(99), stems = [], heads = [], colors = [];
  const palette = [0xe03b3b, 0xf2d13a, 0xffffff, 0xd96bd9, 0x4f8fe0, 0xff9a2e];

const appleMats = { red: lam(T.apple), gold: lam(T.gold, { emissive: 0xaa7700, emissiveIntensity: 0.5 }) };
const appleGeo = new THREE.BoxGeometry(0.62, 0.62, 0.62);
const stemGeo = new THREE.BoxGeometry(0.07, 0.2, 0.07), leafGeo = new THREE.BoxGeometry(0.22, 0.05, 0.12);
const stemMat = new THREE.MeshLambertMaterial({ color: 0x5a3a1a }), leafMat = new THREE.MeshLambertMaterial({ color: 0x4caf3a });
function makeApple(gold) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(appleGeo, gold ? appleMats.gold : appleMats.red);
  body.castShadow = true; body.position.y = 0.31;
  const stem = new THREE.Mesh(stemGeo, stemMat); stem.position.set(0, 0.72, 0);

  return g;

const particles = [];
const pGeo = new THREE.BoxGeometry(1, 1, 1);
const pMats = new Map();
const pMat = c => { let m = pMats.get(c); if (!m) { m = new THREE.MeshLambertMaterial({ color: c, emissive: c, emissiveIntensity: 0.25 }); pMats.set(c, m); } return m; };
function burst(pos, n, colors, { speed = 2.5, up = 3, size = 0.12, life = 1, spread = 0.3 } = {}) {
  const t = now();
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(pGeo, pMat(pick(colors)));
    const s = size * (0.6 + Math.random() * 0.8);
    m.scale.setScalar(s);
    m.position.set(pos.x + (Math.random() - 0.5) * spread * 2, pos.y, pos.z + (Math.random() - 0.5) * spread * 2);
    scene.add(m);
    particles.push({
      m, s, born: t, life: life * (0.7 + Math.random() * 0.6),
      vel: new THREE.Vector3((Math.random() - 0.5) * speed * 2, up * (0.5 + Math.random()), (Math.random() - 0.5) * speed * 2),
    });
  }
}
function updateParticles(dt, t) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const age = (t - p.born) / p.life;
    if (age >= 1) { scene.remove(p.m); particles.splice(i, 1); continue; }
    p.vel.y -= 14 * dt;
    p.m.position.addScaledVector(p.vel, dt);
    const floorY = FLOOR_Y + p.s / 2;
    if (p.m.position.y < floorY && p.vel.y < 0) { p.m.position.y = floorY; p.vel.y *= -0.3; p.vel.x *= 0.7; p.vel.z *= 0.7; }
    p.m.rotation.x += dt * 5; p.m.rotation.z += dt * 4;
    p.m.scale.setScalar(p.s * (1 - age * age));
  }
}

/* ------------------------------------------------------------------ */
/*  Logica di gioco                                                   */
/* ------------------------------------------------------------------ */
const POINTS_FOOD = 10, POINTS_GOLD = 50, BONUS_LIFE = 9;
let state = 'ready';            // ready | play | pause | dead | won
let segs = [], prev = [];       // celle correnti / precedenti (per l'interpolazione)
let dir = { x: 0, z: -1 }, dirQ = [];
let food = null, bonus = null;  // { x, z, g, expires? }
let score = 0, eaten = 0, best = 0, gameId = 0;
let pauseStart = 0, lastTick = 0, nextTick = 0, interval = 150, pausedRemain = 0, pausedAlpha = 1;
let headAngle = 0, headPop = 1;
let shake = { until: 0, dur: 1, mag: 0 };

try { best = +localStorage.getItem('snake-best') || 0; } catch (e) {}
const statusEl = $('#status'), speedEl = $('#speed'), btnNew = $('#btnNew'), btnPause = $('#btnPause'), btnMute = $('#btnMute');
try { const s = localStorage.getItem('snake-speed'); if (s) speedEl.value = s; } catch (e) {}

function setStatus(txt, cls = '') { statusEl.textContent = txt; statusEl.className = 'hud panel ' + cls; }
function updateHUD() { $('#sScore').textContent = score; $('#sBest').textContent = best; $('#sLen').textContent = segs.length; }
const baseInterval = () => (+speedEl.value / 1000) * Math.max(0.55, 1 - eaten * 0.02);   // secondi per casella
const key = (x, z) => x + ',' + z;

function freeCell() {
  const used = new Set(segs.map(s => key(s.x, s.z)));
  if (food) used.add(key(food.x, food.z));
  if (bonus) used.add(key(bonus.x, bonus.z));
  if (used.size >= CELLS) return null;
  for (;;) {
    const x = Math.floor(Math.random() * (2 * N + 1)) - N, z = Math.floor(Math.random() * (2 * N + 1)) - N;
    if (!used.has(key(x, z))) return { x, z };
  }
}
function placeApple(gold) {
  const c = freeCell();
  if (!c) return null;
  const g = makeApple(gold);
  g.position.set(c.x, FLOOR_Y, c.z);
  burst(new THREE.Vector3(c.x, FLOOR_Y + 0.3, c.z), gold ? 12 : 6, gold ? [0xffe27d, 0xffffff, 0xffc933] : [0xdddddd, 0xffffff], { speed: 1, up: 2, size: 0.07, life: 0.6 });
  return { x: c.x, z: c.z, g, born: now() };
}
function removeApple(a) { if (a) scene.remove(a.g); }

// direzione "su/giu/sx/dx" dello schermo -> asse del mondo piu' vicino
function screenDir(which) {
  const f = [-Math.sin(az), -Math.cos(az)], r = [-f[1], f[0]];
  const v = which === 'up' ? f : which === 'down' ? [-f[0], -f[1]] : which === 'right' ? r : [-r[0], -r[1]];
  return Math.abs(v[0]) > Math.abs(v[1]) ? { x: Math.sign(v[0]), z: 0 } : { x: 0, z: Math.sign(v[1]) };
}

function reset() {
  gameId++;
  segs.length = 0;
  removeApple(food); removeApple(bonus); food = bonus = null;
  bodyMeshes.forEach(m => m.visible = false);
  glowMats.forEach(m => { if (m.emissive) { m.emissive.setHex(0x000000); m.emissiveIntensity = 1; } });
  dir = screenDir('up'); dirQ = [];
  for (let i = 0; i < 3; i++) segs.push({ x: -dir.x * i, z: -dir.z * i });
  prev = segs.map(s => ({ ...s }));
  score = 0; eaten = 0; headPop = 1;
  headAngle = Math.atan2(dir.x, dir.z);
  food = placeApple(false);
  state = 'ready';
  btnNew.classList.remove('pulse'); btnPause.textContent = 'Pausa';
  setStatus(matchMedia('(pointer: coarse)').matches ? 'Scorri o usa le frecce per iniziare' : 'Premi una freccia (o WASD) per iniziare');
  updateHUD();
}

function startPlay() {
  state = 'play';
  interval = baseInterval();
  lastTick = now(); nextTick = lastTick + interval;
  sfx.start();
  setStatus('Mangia le mele rosse!');
}

function pause() {
  if (state !== 'play') return;
  const t = now();
  pausedRemain = nextTick - t; pauseStart = t;
  pausedAlpha = clamp((t - lastTick) / interval, 0, 1);
  state = 'pause'; btnPause.textContent = 'Riprendi';
  setStatus('PAUSA'); sfx.pause();
}
function resume() {
  if (state !== 'pause') return;
  const t = now();
  nextTick = t + pausedRemain; lastTick = nextTick - interval;
  if (bonus) bonus.born += t - pauseStart;   // il bonus non scade in pausa
  state = 'play'; btnPause.textContent = 'Pausa';
  setStatus(bonus ? "Mela d'oro! Prendila!" : 'Mangia le mele rosse!', bonus ? 'gold' : ''); sfx.resume();
}
function togglePause() { state === 'play' ? pause() : resume(); }

function inputDir(which) {
  ensureAudio();
  if (state === 'pause') { resume(); return; }          // un tasto direzionale riprende la partita
  if (state !== 'ready' && state !== 'play') return;
  const d = screenDir(which);
  if (state === 'ready') {
    dir = d; headAngle = Math.atan2(d.x, d.z);
    segs = segs.map((_, i) => ({ x: -d.x * i, z: -d.z * i }));
    prev = segs.map(s => ({ ...s }));
    startPlay();
    return;
  }
  const last = dirQ.length ? dirQ[dirQ.length - 1] : dir;
  if ((d.x === -last.x && d.z === -last.z) || (d.x === last.x && d.z === last.z)) {
    return;
  }
  if (dirQ.length < 2) { dirQ.push(d); sfx.turn(); }
}

function step() {
  if (dirQ.length) dir = dirQ.shift();
  const head = segs[0];
  const nx = head.x + dir.x, nz = head.z + dir.z;
  if (Math.abs(nx) > N || Math.abs(nz) > N) return die();

  const eatFood = food && nx === food.x && nz === food.z;
  const eatBonus = bonus && nx === bonus.x && nz === bonus.z;
  const grow = eatFood || eatBonus;
  const check = grow ? segs.length : segs.length - 1;   // la coda si sposta se non si cresce
  for (let i = 0; i < check; i++) if (segs[i].x === nx && segs[i].z === nz) return die();

  const old = segs;
  segs = [{ x: nx, z: nz }];
  for (let i = 0; i < old.length; i++) segs.push({ ...old[i] });
  if (!grow) segs.pop();
  prev = segs.map((s, i) => ({ ...(old[Math.min(i, old.length - 1)]) }));
  lastTick = now();

  if (eatFood || eatBonus) {
    const gold = eatBonus;
    const pos = new THREE.Vector3(nx, FLOOR_Y + 0.4, nz);
    score += gold ? POINTS_GOLD : POINTS_FOOD;
    eaten++; headPop = 1.35;
    if (gold) {
      removeApple(bonus); bonus = null; sfx.gold();
      burst(pos, 28, [0xffe27d, 0xffc933, 0xffffff], { speed: 2.5, up: 4, size: 0.12, life: 1 });
    } else {
      removeApple(food); sfx.eat();
      burst(pos, 14, [0xd22a24, 0xff6a5e, 0x5fbf4f], { speed: 1.8, up: 3, size: 0.1, life: 0.8 });
      if (segs.length >= CELLS) { food = null; return win(); }
      food = placeApple(false);
      if (!bonus && segs.length >= 5 && Math.random() < 0.22) { bonus = placeApple(true); if (bonus) sfx.bonusSpawn(); }
    }
    if (score > best) best = score;
    setStatus(bonus ? "Mela d'oro! Prendila!" : 'Mangia le mele rosse!', bonus ? 'gold' : '');
    updateHUD();
  }
  interval = baseInterval();
}

function endGame() {
  state = 'dead';
  btnNew.classList.add('pulse');
  let record = false;
  try { if (score > (+localStorage.getItem('snake-best') || 0)) { localStorage.setItem('snake-best', String(score)); record = true; } } catch (e) {}
  best = Math.max(best, score);
  updateHUD();
  return record;
}

function die() {
  prev = segs.map(s => ({ ...s }));
  const record = endGame();
  const id = gameId;
  sfx.die();
  shake = { until: now() + 0.5, dur: 0.5, mag: 0.4 };
  const h = segs[0];
  burst(new THREE.Vector3(h.x, SEG_Y, h.z), 24, [0x40aa4a, 0x2f8a3a, 0x8fe08a, 0xffffff], { speed: 3, up: 5, size: 0.16, life: 1.3 });
  setStatus(`Game over - ${score} punti`, 'lose');
  setTimeout(() => {                                    // esplosione finale a catena
    if (id !== gameId) return;
    shake = { until: now() + 0.6, dur: 0.6, mag: 0.5 };
    segs.forEach(s => burst(new THREE.Vector3(s.x, SEG_Y, s.z), 5, [0x4a4a4a, 0x2f2f2f, 0x5fae4f, 0x8a8a8a, 0xff8a2e], { speed: 2, up: 4, size: 0.15, life: 1.2 }));
    if (record && score > 0) { setStatus(`Nuovo record: ${score} punti!`, 'win'); sfx.record(); }
  }, 950);
}

function win() {
  endGame();
  const id = gameId;
  setStatus("Arena completa! Perfetto!", 'win');
  sfx.win();
  const cols = [0xff5148, 0xffe27d, 0x7dff7d, 0x6df0ea, 0xffffff, 0xd96bd9];
  [0, 400, 800, 1200].forEach(ms => setTimeout(() => { if (id === gameId) burst(new THREE.Vector3((Math.random() - 0.5) * 8, 1.5, (Math.random() - 0.5) * 8), 60, cols, { speed: 3.2, up: 8, size: 0.14, life: 2.2, spread: 2 }); }, ms));
}

let tgtAz = 0.0, tgtPhi = 0.8, tgtR = 21, az = tgtAz, phi = tgtPhi, rad = tgtR;
let dragging = false, moved = false, lastX = 0, lastY = 0, startX = 0, startY = 0, sx0 = 0, sy0 = 0;

canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  dragging = true; moved = false;
  lastX = startX = sx0 = e.clientX; lastY = startY = sy0 = e.clientY;
  canvas.setPointerCapture(e.pointerId);
  if (e.pointerType === 'mouse') canvas.classList.add('drag');
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  if (e.pointerType === 'mouse') {
    if (Math.hypot(e.clientX - startX, e.clientY - startY) > 4) moved = true;
    if (moved) {
      tgtAz -= (e.clientX - lastX) * 0.006;
      tgtPhi = clamp(tgtPhi - (e.clientY - lastY) * 0.005, 0.3, 1.38);
    }
    lastX = e.clientX; lastY = e.clientY;
  } else {                                           // touch: swipe = direzione
    const dx = e.clientX - sx0, dy = e.clientY - sy0;
    if (Math.hypot(dx, dy) > 28) {
      moved = true;
      inputDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
      sx0 = e.clientX; sy0 = e.clientY;
    }
  }
});
canvas.addEventListener('pointerup', e => {
  dragging = false; canvas.classList.remove('drag');
  if (!moved && e.pointerType !== 'mouse' && state === 'ready') startPlay();
});
canvas.addEventListener('pointercancel', () => { dragging = false; canvas.classList.remove('drag'); });
canvas.addEventListener('wheel', e => { e.preventDefault(); tgtR = clamp(tgtR + e.deltaY * 0.015, 12, 38); }, { passive: false });

document.querySelectorAll('#dpad [data-d]').forEach(b =>
  b.addEventListener('pointerdown', e => { e.preventDefault(); inputDir(b.dataset.d); }));

function newGame() { ensureAudio(); sfx.ui(); reset(); }
btnNew.addEventListener('click', () => { newGame(); btnNew.blur(); });
btnPause.addEventListener('click', () => { ensureAudio(); if (state === 'play' || state === 'pause') togglePause(); btnPause.blur(); });
speedEl.addEventListener('change', () => { ensureAudio(); sfx.ui(); try { localStorage.setItem('snake-speed', speedEl.value); } catch (e) {} speedEl.blur(); });
function toggleMute() {
  ensureAudio();
  muted = !muted;
  if (master) master.gain.value = muted ? 0 : 0.55;
  btnMute.textContent = 'Suono: ' + (muted ? 'NO' : 'SI');
  if (!muted) sfx.ui();
}
btnMute.addEventListener('click', () => { toggleMute(); btnMute.blur(); });

const KEYS = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
const KEYS_BY_CHAR = { w: 'up', s: 'down', a: 'left', d: 'right' };   // fallback se e.code non e' disponibile
window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const dirKey = KEYS[e.code] || KEYS[e.key] || KEYS_BY_CHAR[(e.key || '').toLowerCase()];
  if (dirKey) {
    e.preventDefault();
    if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();   // il focus su select/bottoni non deve rubare i tasti
    if (!e.repeat) inputDir(dirKey);
    return;
  }
  if (e.target === speedEl) return;
  ensureAudio();
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (e.repeat) return;
    if (state === 'ready') startPlay();
    else if (state === 'play' || state === 'pause') { if (e.key === ' ') togglePause(); }
    else newGame();
  } else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { if (state === 'play' || state === 'pause') togglePause(); }
  else if (e.key === 'r' || e.key === 'R') newGame();
  else if (e.key === 'm' || e.key === 'M') toggleMute();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = camera.aspect < 1 ? 75 : 55;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();
if (camera.aspect < 1) tgtR = rad = 30;

const target = new THREE.Vector3(0, 0.8, 0);
const angleDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
let last = now();

function frame() {
  const t = now(), dt = Math.min(0.05, t - last);
  last = t;

  // logica a tick fissi
  if (state === 'play' && t >= nextTick) {
    step();
    if (state === 'play') nextTick = lastTick + interval;
  }

  // camera orbitale
  const k = Math.min(1, dt * 8);
  az += (tgtAz - az) * k; phi += (tgtPhi - phi) * k; rad += (tgtR - rad) * k;
  const a = az + Math.sin(t * 0.15) * 0.03;
  camera.position.set(
    target.x + rad * Math.sin(phi) * Math.sin(a),
    target.y + rad * Math.cos(phi),
    target.z + rad * Math.sin(phi) * Math.cos(a));
  if (t < shake.until) {
    const s = shake.mag * (shake.until - t) / shake.dur;
    camera.position.x += (Math.random() - 0.5) * s; camera.position.y += (Math.random() - 0.5) * s;
  }
  camera.lookAt(target);

  sky.position.copy(camera.position);
  sunDisc.position.copy(camera.position).addScaledVector(sunDir, 220);
  sunDisc.lookAt(camera.position);

  T.water.offset.x += dt * 0.03; T.water.offset.y += dt * 0.015;
  for (const c of clouds) { c.position.x += c.userData.speed * dt; if (c.position.x > 90) c.position.x = -90; }
  for (const o of torches) {
    const f = 0.8 + 0.2 * Math.sin(t * 13 + o.k * 2) + (Math.random() - 0.5) * 0.15;
    o.light.intensity = 12 * f; o.tip.scale.setScalar(0.85 + 0.15 * f);
  }

  // serpente (interpolato tra cella precedente e corrente)
  const alpha = state === 'play' ? clamp((t - lastTick) / interval, 0, 1) : state === 'pause' ? pausedAlpha : 1;
  const wave = state === 'play' ? 1 : 0;
  for (let i = 0; i < segs.length; i++) {
    const c = segs[i], p = prev[i] || c;
    const x = p.x + (c.x - p.x) * alpha, z = p.z + (c.z - p.z) * alpha;
    const y = SEG_Y + wave * 0.05 * Math.sin(t * 9 - i * 0.7);
    const m = i === 0 ? headMesh : getBody(i);
    m.visible = true;
    m.position.set(x, y, z);
  }
  for (let i = Math.max(0, segs.length - 1); i < bodyMeshes.length; i++) bodyMeshes[i].visible = false;
  headAngle += angleDiff(Math.atan2(dir.x, dir.z), headAngle) * Math.min(1, dt * 18);
  headMesh.rotation.y = headAngle;
  headPop += (1 - headPop) * Math.min(1, dt * 9);
  headMesh.scale.setScalar(headPop);

  if (state === 'dead') {
    const e = 0.5 + 0.5 * Math.sin(t * 10);
    for (const m of glowMats) { m.emissive.setHex(0xaa2020); m.emissiveIntensity = 0.3 + 0.5 * e; }
  }

  // mele: rotazione e galleggiamento; la dorata lampeggia prima di sparire
  if (food) { food.g.rotation.y = t * 1.8; food.g.position.y = FLOOR_Y + 0.08 + 0.06 * Math.sin(t * 3); }
  if (bonus) {
    const left = BONUS_LIFE - (t - bonus.born);
    if (left <= 0 && state === 'play') {
      burst(new THREE.Vector3(bonus.x, FLOOR_Y + 0.4, bonus.z), 10, [0xaaaaaa, 0xdddddd], { speed: 1, up: 2, size: 0.08, life: 0.6 });
      removeApple(bonus); bonus = null; sfx.bonusMiss(); setStatus('Mangia le mele rosse!');
    } else {
      bonus.g.rotation.y = -t * 2.5; bonus.g.position.y = FLOOR_Y + 0.12 + 0.1 * Math.sin(t * 4);
      bonus.g.visible = left > 3 || Math.floor(t * 8) % 2 === 0;
    }
  }

  updateParticles(dt, t);
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);

reset();
$('#loading').classList.add('done');
</script>
</body>
</html>
