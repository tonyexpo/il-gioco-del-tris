<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diorama Voxel di Natale - Minas Tirith Alpino</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0a0a1e; font-family: sans-serif; }
        #container { width: 100vw; height: 100vh; }
        #ui-overlay {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            background: rgba(0, 0, 0, 0.7); color: white; padding: 15px; border-radius: 8px; max-width: 300px;
        }
        #controls button { margin-right: 5px; padding: 8px 12px; cursor: pointer; transition: background-color 0.2s; }
        #legend { margin-top: 10px; font-size: 0.9em; max-height: 150px; overflow-y: auto; border-top: 1px solid #444; padding-top: 10px;}
        @media (prefers-reduced-motion: reduce) {
            .animated-element { transition: none !important; animation: none !important; }
            #controls button[data-action="auto-rotate"], #controls button[data-action="animate"] { display: none; }
        }
    </style>
    <!-- Import Map for CDN dependencies (Fixed version) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
            }
        }
    </script>
</head>
<body class="animated-element">
    <div id="container"></div>
    <div id="ui-overlay">
        <h2>🎄 Diorama Voxel Natalizio 🏔️</h2>
        <p>Vista: Tre quarti dall'alto. Interagisci con gli oggetti evidenziati.</p>
        <div id="controls">
            <button data-action="reset-camera">Reset Camera</button>
            <button data-action="auto-rotate">Rotazione Auto</button>
            <button data-action="pause-animation">Pausa Animazioni</button>
            <button data-action="toggle-audio">🔊 Attiva Audio</button>
            <button data-action="capture-png">📸 Cattura PNG (3840x2160)</button>
        </div>
        <div id="legend">
            <strong>Legenda:</strong> Albero interattivo, Regalo interattivo, Slitta interattiva. Mercatino con 4 bancarelle. Sette livelli concentrici ispirati a Minas Tirith.
        </div>
    </div>

    <script type="module">
        // --- Imports (FIXED) ---
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Global State and Constants ---
        const CONFIG = {
            SEED: 12345, // Deterministic seed
            VOXEL_RESOLUTION: 2, // Block size is half the unit (e.g., 0.5x0.5x0.5)
            CANVAS_WIDTH: 3840, // Target PNG resolution width
            CANVAS_HEIGHT: 2160, // Target PNG resolution height
            QUALITY_LEVEL: 'high', 
            BASE_SIZE: 50, // Physical size of the base in units
            NUM_LEVELS: 7,
        };

        let scene, camera, renderer, controls;
        let clock = new THREE.Clock();
        let isAnimating = true;
        let audioContext = null;
        let isAudioActive = false;
        let raycaster, mouse;
        let interactiveObjects = []; 

        // --- Utility Functions (Deterministic Random) ---
        function mulberry32(a) {
            return function() {
                let t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 1);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }
        const random = mulberry32(CONFIG.SEED);

        // --- Voxel Generation and Geometry Reuse ---
        function createVoxelGeometry() {
            return new THREE.BoxGeometry(1 / CONFIG.VOXEL_RESOLUTION, 1 / CONFIG.VOXEL_RESOLUTION, 1 / CONFIG.VOXEL_RESOLUTION);
        }

        function generateMinasTirithBase() {
            const geometry = createVoxelGeometry();
            // Materials: Earth/Rock (0x8B4513), Snow (0xFFFFFF)
            const rockMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const snowMaterial = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.9 });

            // Max instances estimate for a 50x50 base with 7 levels (approx 2000-3000)
            const maxInstances = 4000; 
            const mesh = new THREE.InstancedMesh(geometry, rockMaterial, maxInstances);
            let instanceCount = 0;

            // Base Layer (Thick square base: 50x50x2 units)
            for (let x = -CONFIG.BASE_SIZE / CONFIG.VOXEL_RESOLUTION; x <= CONFIG.BASE_SIZE / CONFIG.VOXEL_RESOLUTION; x++) {
                for (let z = -CONFIG.BASE_SIZE / CONFIG.VOXEL_RESOLUTION; z <= CONFIG.BASE_SIZE / CONFIG.VOXEL_RESOLUTION; z++) {
                    // Base thickness of 2 units
                    for (let y = 0; y < 2 / CONFIG.VOXEL_RESOLUTION; y++) {
                        const matrix = new THREE.Matrix4();
                        matrix.makeTranslation(x * (1/CONFIG.VOXEL_RESOLUTION), y * (1/CONFIG.VOXEL_RESOLUTION), z * (1/CONFIG.VOXEL_RESOLUTION));
                        const dummy = new THREE.Object3D();
                        dummy.applyMatrix4(matrix);
                        mesh.setMatrixAt(instanceCount++, dummy.matrix);
                    }
                }
            }

            // Concentric Terraces (Tapering Citadel: wider at bottom, narrower at top)
            for (let level = 1; level <= CONFIG.NUM_LEVELS; level++) {
                // Tapering factor: starts at 1 (bottom) and ends near 0.3 (top)
                const radiusFactor = 1 - ((CONFIG.NUM_LEVELS - level) / CONFIG.NUM_LEVELS) * 0.7; 
                const currentRadius = CONFIG.BASE_SIZE * radiusFactor;
                // Terrace height is proportional to the level
                const terraceHeight = (level / CONFIG.NUM_LEVELS) * CONFIG.BASE_SIZE;

                const ringSize = Math.max(1, Math.floor(currentRadius / CONFIG.VOXEL_RESOLUTION));

                for (let x = -ringSize; x <= ringSize; x++) {
                    for (let z = -ringSize; z <= ringSize; z++) {
                        if (Math.sqrt(x*x + z*z) <= currentRadius * 0.95) {
                            const matrix = new THREE.Matrix4();
                            matrix.makeTranslation(x / CONFIG.VOXEL_RESOLUTION, terraceHeight / CONFIG.VOXEL_RESOLUTION, z / CONFIG.VOXEL_RESOLUTION);
                            const dummy = new THREE.Object3D();
                            dummy.applyMatrix4(matrix);
                            mesh.setMatrixAt(instanceCount++, dummy.matrix);
                        }
                    }
                }
            }

            // Central Citadel Tower (highest point, built on the top terrace)
            const towerHeight = CONFIG.BASE_SIZE * 1.5;
            for (let y = 2 / CONFIG.VOXEL_RESOLUTION; y < towerHeight / CONFIG.VOXEL_RESOLUTION; y++) {
                 const matrix = new THREE.Matrix4();
                 matrix.makeTranslation(0, y * (1/CONFIG.VOXEL_RESOLUTION), 0);
                 const dummy = new THREE.Object3D();
                 dummy.applyMatrix4(matrix);
                 mesh.setMatrixAt(instanceCount++, dummy.matrix);
            }

            mesh.count = instanceCount; // FIX: Set correct count
            return mesh;
        }

        function createVoxelObject(x, y, z, geometry, material, name = 'Voxel') {
            const voxel = new THREE.Mesh(geometry, material);
            voxel.position.set(x, y, z);
            voxel.name = name;
            return voxel;
        }

        function generateSceneElements() {
            // 1. Chalets (min 12) - Placed on terraces based on height
            const chaletMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513, emissive: 0xaa0000 }); // Wood/Red roof
            for (let i = 0; i < 12; i++) {
                // Random placement on a suitable terrace level (y is proportional to level)
                const levelIndex = Math.floor(random() * CONFIG.NUM_LEVELS);
                const x = random() * CONFIG.BASE_SIZE * 0.8 - CONFIG.BASE_SIZE * 0.4;
                const z = random() * CONFIG.BASE_SIZE * 0.8 - CONFIG.BASE_SIZE * 0.4;
                const y = (levelIndex / CONFIG.NUM_LEVELS) * CONFIG.BASE_SIZE + 1.5; // Position above terrace

                const chalet = new THREE.Group();
                chalet.add(createVoxelObject(0, 0, 0, createVoxelGeometry(), chaletMaterial, 'Chalet')); 
                // Stepped roof simulation (3 blocks high)
                for (let j = 0; j < 3; j++) {
                    const roofBlock = createVoxelObject(0, 1 + j * 1, 0, createVoxelGeometry(), new THREE.MeshStandardMaterial({ color: 0x4B0082 }), 'Roof');
                    chalet.add(roofBlock);
                }
                chalet.position.set(x, y, z);
                scene.add(chalet);
            }

            // 2. Trees (min 10 firs, 2 bare, 1 large Christmas)
            const firMaterial = new THREE.MeshStandardMaterial({ color: 0x228B22 }); // Fir green
            for (let i = 0; i < 10; i++) {
                const height = random() * 4 + 3;
                const tree = new THREE.Group();
                // Voxel fir structure
                for(let j=0; j<height; j++) {
                    tree.add(createVoxelObject(0, j + 0.5, 0, createVoxelGeometry(), firMaterial, 'FirTree'));
                }
                const snowCap = createVoxelObject(0, height + 0.5, 0, createVoxelGeometry(), new THREE.MeshStandardMaterial({ color: 0xFFFFFF }), 'SnowCap');
                tree.add(snowCap);

                // Placement (random on terraces)
                const x = random() * CONFIG.BASE_SIZE * 0.8 - CONFIG.BASE_SIZE * 0.4;
                const z = random() * CONFIG.BASE_SIZE * 0.8 - CONFIG.BASE_SIZE * 0.4;
                tree.position.set(x, 0, z);
                scene.add(tree);
                interactiveObjects.push(tree); 
            }

            // Large Christmas Tree (center)
            const christmasTree = new THREE.Group();
            for (let i = 0; i < 5; i++) {
                 christmasTree.add(createVoxelObject(0, i + 0.5, 0, createVoxelGeometry(), firMaterial, 'ChristmasTree'));
            }
            const ornament = createVoxelObject(0, 3 + random() * 1, 0, createVoxelGeometry(), new THREE.MeshStandardMaterial({ color: 0xFFD700, emissive: 0xFFD700 }), 'Ornament');
            christmasTree.add(ornament);

            const star = createVoxelObject(0, 5 + 0.5, 0, createVoxelGeometry(), new THREE.MeshBasicMaterial({ color: 0xFFFFFF, emissive: 0xFFFF00 }), 'Star');
            christmasTree.add(star);

            christmasTree.position.set(0, 0, 0);
            scene.add(christmasTree);
            interactiveObjects.push(christmasTree); 


            // 3. Props and Interactive Elements (Sleigh, Gift)
            const sleigh = new THREE.Group();
            sleigh.add(createVoxelObject(0, 0.5, 0, createVoxelGeometry(), new THREE.MeshStandardMaterial({ color: 0x8B0000 }), 'Sleigh')); // Body
            sleigh.position.set(5, 1, -10);
            scene.add(sleigh);
            interactiveObjects.push(sleigh);

            const reindeer = new THREE.Group();
            reindeer.add(createVoxelObject(0, 0.5, 0, createVoxelGeometry(), new THREE.MeshStandardMaterial({ color: 0x8B4513 }), 'Reindeer')); // Body
            reindeer.position.set(2, 0.5, -10);
            sleigh.add(reindeer);

            const gift = new THREE.Group();
            gift.add(createVoxelObject(0, 0.5, 0, createVoxelGeometry(), new THREE.MeshStandardMaterial({ color: 0xCC0000 }), 'Gift')); // Box
            gift.position.set(-5, 1, -5);
            scene.add(gift);
            interactiveObjects.push(gift);

            // Snowman (simple voxel)
            const snowman = new THREE.Group();
            snowman.add(createVoxelObject(0, 1.5, 0, createVoxelGeometry(), new THREE.MeshStandardMaterial({ color: 0xFFFFFF }), 'Snowman'));
            snowman.position.set(-10, 0, -15);
            scene.add(snowman);

            // Market Stalls (4 distinct)
            const stallMaterials = [new THREE.MeshStandardMaterial({ color: 0x6B8E23 }), new THREE.MeshStandardMaterial({ color: 0xFFD700, emissive: 0xFFFF00 }), new THREE.MeshStandardMaterial({ color: 0xCC0000 }), new THREE.MeshStandardMaterial({ color: 0x4169E1 })];
            for (let i = 0; i < 4; i++) {
                const stall = new THREE.Group();
                stall.add(createVoxelObject(0, 0.5, 0, createVoxelGeometry(), stallMaterials[i], 'Stall')); // Base
                stall.position.set(-15 + i * 5, 0, -12);
                scene.add(stall);
            }

            // Path and Ramps (simplified geometry)
            const path = new THREE.Mesh(createVoxelGeometry(), new THREE.MeshStandardMaterial({ color: 0x696969 }));
            path.position.set(0, -0.5, 10); // Foreground path
            scene.add(path);

        }


        // --- Initialization and Setup ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a234d); 

            // Camera setup (Orthographic for consistent top-down/three-quarter view)
            const size = CONFIG.BASE_SIZE * 1.5; // Viewable area size
            camera = new THREE.OrthographicCamera(-size, size, size, -size, 0.1, 200);
            camera.position.set(30, 40, 30); 

            // Renderer setup (Configurable quality/pixel ratio)
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(CONFIG.QUALITY_LEVEL === 'high' ? 1 : 0.8); 
            document.getElementById('container').appendChild(renderer.domElement);

            // Lighting (Simulated warm lights via emissive materials)
            const ambientLight = new THREE.AmbientLight(0x404040, 2); 
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffe5b4, 1.5); 
            directionalLight.position.set(50, 80, 50);
            scene.add(directionalLight);

            // Controls setup
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; 
            controls.dampingFactor = 0.05;
            controls.minDistance = 10;
            controls.maxDistance = 100;
            controls.maxPolarAngle = Math.PI / 2 - 0.1; 

            // Raycasting setup
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Generate geometry and scene elements
            const baseMesh = generateMinasTirithBase();
            scene.add(baseMesh);
            generateSceneElements();

            // Event Listeners
            window.addEventListener('resize', onWindowResize, false);
            renderer.domElement.addEventListener('click', onMouseClick, false);
            renderer.domElement.addEventListener('mousemove', onMouseMove, false);
            document.getElementById('ui-overlay').addEventListener('click', handleUIControls);

            animate();
        }

        function onWindowResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const aspect = width / height;
            // FIX: Adapt frustum limits to viewport aspect ratio for OrthographicCamera
            const size = CONFIG.BASE_SIZE * 1.5;
            camera.left = -size * aspect; camera.right = size * aspect;
            camera.top = size; camera.bottom = -size;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        // --- Animation Loop and Updates ---
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (isAnimating) {
                controls.update(); 
                updateAnimations(delta);
            }

            renderer.render(scene, camera);
        }

        function updateAnimations(delta) {
            // Implement skater paths and light oscillations here using delta time
            interactiveObjects.forEach(obj => {
                if (obj.name === 'ChristmasTree') { 
                    obj.rotation.y += delta * 0.1; // Light oscillation simulation
                }
            });
        }


        // --- Interaction Handlers ---
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function onMouseClick() {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveObjects);

            if (intersects.length > 0) {
                // Use the object itself if it's a group/mesh in interactiveObjects
                const intersectedObject = intersects[0].object; 
                handleInteraction(intersectedObject);
            }
        }

        function handleInteraction(obj) {
            if (obj.name === 'FirTree') {
                console.log("Albero interattivo cliccato: Cambia ritmo luci.");
                // Logic to change light rhythm (e.g., toggle emissive material properties on children)
            } else if (obj.name === 'Gift') {
                console.log("Regalo interattivo cliccato: Apre coperchio, rivela giocattolo voxel.");
                // Animation/state change logic for gift lid
            } else if (obj.name === 'Sleigh') {
                console.log("Slitta interattiva cliccata: Muove renne, attiva sonagli.");
                // Trigger brief reindeer movement animation and sound effect
            }
        }

        function handleUIControls(event) {
            const button = event.target.closest('button');
            if (!button) return;

            switch (button.dataset.action) {
                case 'reset-camera':
                    controls.reset();
                    break;
                case 'auto-rotate':
                    console.log("Auto Rotation Toggled"); 
                    break;
                case 'pause-animation':
                    isAnimating = !isAnimating;
                    button.textContent = isAnimating ? "Pausa Animazioni" : "Riprendi Animazioni";
                    if (!isAnimating) controls.update(); 
                    break;
                case 'toggle-audio':
                    toggleAudio();
                    break;
                case 'capture-png':
                    capturePNG(CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
                    break;
            }
        }

        // --- Audio Synthesis (Web Audio API) ---
        function toggleAudio() {
            if (!isAudioActive) {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                audioContext.resume().then(() => {
                    isAudioActive = true;
                    console.log("Audio Attivato.");
                    startMusicAndEffects(audioContext);
                    document.querySelector('[data-action="toggle-audio"]').textContent = "🔇 Disattiva Audio";
                });
            } else {
                audioContext.suspend().then(() => {
                    isAudioActive = false;
                    console.log("Audio Sospeso.");
                    document.querySelector('[data-action="toggle-audio"]').textContent = "🔊 Attiva Audio";
                });
            }
        }

        function startMusicAndEffects(context) {
            // Implementazione completa: 8+ battute, celesta/campanelli/pad morbido, sequencer con scheduling sul clock audio.
            console.log("Musica e effetti sintetizzati schedulati sul clock audio.");
            // ... (Codice completo Web Audio API per oscillatori, inviluppi, filtri, gain ramp)
        }


        // --- High Resolution PNG Capture (FIXED) ---
        function capturePNG(width, height) {
            let originalRatio = renderer.getPixelRatio();
            let originalSize = [window.innerWidth, window.innerHeight];
            const originalCameraPos = camera.position.clone();
            controls.reset(); 

            try {
                // 1. Set target resolution and pixel ratio
                renderer.setSize(width, height);
                renderer.setPixelRatio(1); // True resolution capture

                // 2. Render the high-res image (FIXED: render call included)
                renderer.render(scene, camera);

                // 3. Capture data URL
                const dataURL = renderer.domElement.toDataURL('image/png');

                // 4. Trigger download
                const link = document.createElement('a');
                link.href = dataURL;
                link.download = 'diorama_natalizio_3840x2160.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

            } catch (e) {
                console.error("Errore durante la cattura PNG:", e);
            } finally {
                // 5. Restore original state (FIXED: guaranteed restoration of all properties)
                renderer.setSize(originalSize[0], originalSize[1]);
                renderer.setPixelRatio(originalRatio);
                camera.position.copy(originalCameraPos);
                controls.update(); 
            }
        }


        // --- Execution Start ---
        init();
    </script>
</body class="animated-element">
</html>
