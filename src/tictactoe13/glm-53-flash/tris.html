<head>
<meta charset="UTF-8">

            box-shadow:inset -3px -3px 0 rgba(0,0,0,.4), inset 3px 3px 0 rgba(255,255,255,.15); }

  button.mc:active { box-shadow:inset 4px 4px 0 #4d4d4d, inset -4px -4px 0 #a6a6a6; }
  #hint { bottom:18px; right:16px; font-size:7px; color:#e8f4ff; opacity:.85; text-align:right; }
  #toast { top:42%; left:50%; transform:translate(-50%,-50%) scale(0); font-size:clamp(18px,4vw,34px);
           color:#ffe14d; text-shadow:4px 4px 0 #6b4a00, 7px 7px 0 rgba(0,0,0,.4); transition:transform .25s; }

<body>

<div class="ui" id="hud">

<script>
  // Overlay errori: qualsiasi problema viene mostrato a schermo invece dello schermo azzurro
  function showError(msg) {
    let d = document.getElementById('errbox');
    if (!d) {
      d = document.createElement('div'); d.id = 'errbox';

      document.body.appendChild(d);
    }
    d.textContent += (d.textContent ? '\n' : '') + 'ERRORE: ' + msg;

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
        onerror="showError('CDN cdnjs non raggiungibile, provo jsdelivr...')"></script>
<script>
  if (!window.THREE) document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');
</script>
<script>
"use strict";

/* ============================================================
   AUDIO — effetti sintetizzati con Web Audio API
============================================================ */
const Sound = (() => {
  let ctx = null, on = true;
  const ac = () => ctx || (ctx = new (window.AudioContext || window.webkitAudioContext)());
  function tone(freq, dur, type='square', vol=.15, slide=0) {
    if (!on) return;
    const c = ac(), t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq+slide), t+dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.02);
  }
  function thud(vol=.3) { // colpo sordo tipo "pogo"
    if (!on) return;
    const c = ac(), t = c.currentTime, len = c.sampleRate * .12;
    const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1-i/len)**3;
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=500;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0001, t+.14);
    src.connect(f).connect(g).connect(c.destination); src.start(t);
  }
  return {
    toggle(){ on=!on; return on; },
    resume(){ ac().resume && ac().resume(); },
    hover(){ tone(660,.05,'square',.05); },
    placeX(){ thud(.35); tone(220,.12,'square',.12,-80); },
    placeO(){ thud(.25); tone(392,.15,'triangle',.14,-60); },
    win(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.18,'square',.16),i*110)); },
    lose(){ [392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,.2,'sawtooth',.1),i*140)); },
    draw(){ tone(440,.2,'triangle',.12); setTimeout(()=>tone(440,.25,'triangle',.12),220); },
    pop(){ tone(880,.06,'square',.08); }
  };
})();

/* ============================================================
   TEXTURE — pixel-art procedurali stile Minecraft (canvas)
============================================================ */
function pixelTexture(base, speckle, size=16) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const g = cv.getContext('2d');
  for (let y=0;y<size;y++) for (let x=0;x<size;x++) {
    const s = (Math.random()-.5) * speckle;
    g.fillStyle = `rgb(${(base[0]+s)|0},${(base[1]+s)|0},${(base[2]+s)|0})`;
    g.fillRect(x,y,1,1);
  }
  const t = new THREE.CanvasTexture(cv);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
  return t;
}
function woodTexture(base) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 16;
  const g = cv.getContext('2d');
  for (let y=0;y<16;y++) for (let x=0;x<16;x++) {
    const band = (Math.sin(y*1.3)+1)/2 > .5 ? 12 : -10;
    const s = (Math.random()-.5)*10;
    g.fillStyle = `rgb(${(base[0]+band+s)|0},${(base[1]+band+s)|0},${(base[2]+band+s)|0})`;
    g.fillRect(x,y,1,1);
  }
  const t = new THREE.CanvasTexture(cv);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
  return t;
}
const TEX = {
  grass : pixelTexture([96,168,62], 46),
  dirt  : pixelTexture([134,96,67], 40),
  stone : pixelTexture([128,128,128], 36),
  plank : woodTexture([178,134,86]),
  log   : woodTexture([104,78,48]),
  leaf  : pixelTexture([58,132,54], 55),
  water : pixelTexture([54,110,200], 22),
  red   : pixelTexture([200,60,50], 40),   // X (redstone)
  cyan  : pixelTexture([70,190,190], 40),  // O (diamante)
  cloud : pixelTexture([245,250,255], 10),
  sand  : pixelTexture([216,200,150], 26),
};

/* ============================================================
   SCENA
============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd3f7);
scene.fog = new THREE.Fog(0x9fd9fa, 34, 70);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 200);

// Luce sole + ambient
const sun = new THREE.DirectionalLight(0xfff3d6, 1.05);
sun.position.set(18, 26, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -26;
sun.shadow.camera.right = sun.shadow.camera.top = 26;
sun.shadow.camera.far = 80;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x6b8f4e, .5));
scene.add(new THREE.AmbientLight(0xffffff, .18));

// Sole quadrato nel cielo
const sunCube = new THREE.Mesh(
  new THREE.BoxGeometry(3.4,3.4,.3),
  new THREE.MeshBasicMaterial({ color:0xffe97a })
);
sunCube.position.set(42, 44, -60);
sunCube.lookAt(0,0,0);
scene.add(sunCube);

/* ============================================================
   MONDO — terreno con rumore, alberi, acqua, nuvole
============================================================ */
const WORLD_R = 20, SEA = -0.9;
const seedRand = (() => { let s = 1337; return () => (s = (s*16807) % 2147483647) / 2147483647; })();
const grid = 24, gvals = [];
for (let i=0;i<grid*grid;i++) gvals.push(seedRand());
function vnoise(x, z) {
  const xi = ((x % grid)+grid)%grid, zi = ((z % grid)+grid)%grid;
  const x0 = Math.floor(xi), z0 = Math.floor(zi);
  const fx = xi-x0, fz = zi-z0;
  const sm = t => t*t*(3-2*t);
  const g = (a,b) => gvals[(b%grid)*grid + (a%grid)];
  const gx = sm(fx), gz = sm(fz);
  return (g(x0,z0)*(1-gx)+g(x0+1,z0)*gx)*(1-gz) + (g(x0,z0+1)*(1-gx)+g(x0+1,z0+1)*gx)*gz;
}
function heightAt(x, z) {
  let h = vnoise(x*.12, z*.12)*4.6 + vnoise(x*.31, z*.31)*1.6;
  const d = Math.hypot(x, z);
  const flat = THREE.MathUtils.smoothstep(d, 4.5, 12); // piattaforma al centro
  return THREE.MathUtils.lerp(0.2, h - 0.4, flat) - (d>WORLD_R-3 ? (d-(WORLD_R-3))*.8 : 0);
}

const grassMat  = new THREE.MeshLambertMaterial({ map:TEX.grass });
const dirtMat   = new THREE.MeshLambertMaterial({ map:TEX.dirt });
const stoneMat  = new THREE.MeshLambertMaterial({ map:TEX.stone });
const sandMat   = new THREE.MeshLambertMaterial({ map:TEX.sand });
const waterMat  = new THREE.MeshLambertMaterial({ map:TEX.water, transparent:true, opacity:.75 });
const leafMat   = new THREE.MeshLambertMaterial({ map:TEX.leaf });
const logMat    = new THREE.MeshLambertMaterial({ map:TEX.log });
const blockGeo  = new THREE.BoxGeometry(1,1,1);

const cols = [];
for (let x=-WORLD_R; x<=WORLD_R; x++)
  for (let z=-WORLD_R; z<=WORLD_R; z++)
    if (Math.hypot(x,z) <= WORLD_R) cols.push({ x, z, h: Math.floor(heightAt(x,z)) });

function instanced(mat, transforms) {
  const m = new THREE.InstancedMesh(blockGeo, mat, transforms.length);
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion();
  transforms.forEach((t,i) => { M.compose(new THREE.Vector3(t[0], t[1], t[2]), Q, new THREE.Vector3(1,1,1)); m.setMatrixAt(i, M); });
  m.castShadow = m.receiveShadow = true;
  scene.add(m); return m;
}
const grassT = [], dirtT = [], stoneT = [], sandT = [];
for (const c of cols) {
  const topY = c.h;
  let under = topY;
  for (const n of [[c.x+1,c.z],[c.x-1,c.z],[c.x,c.z+1],[c.x,c.z-1]]) {
    const nh = Math.floor(heightAt(n[0], n[1]));
    under = Math.min(under, nh);
  }
  const isBeach = topY <= SEA+1;
  for (let y = under; y <= topY; y++) {
    if (y === topY) {
      if (isBeach) sandT.push([c.x+.5, y+.5, c.z+.5]);
      else if (y <= 1) stoneT.push([c.x+.5, y+.5, c.z+.5]);
      else grassT.push([c.x+.5, y+.5, c.z+.5]);
    } else dirtT.push([c.x+.5, y+.5, c.z+.5]);
  }
  if (topY < SEA) {
    for (let y = topY+1; y <= SEA; y++) sandT.push([c.x+.5, y+.5, c.z+.5]);
  }
}
instanced(grassMat, grassT); instanced(dirtMat, dirtT);
instanced(stoneMat, stoneT); instanced(sandMat, sandT);

// Acqua (piani leggermente ondulanti)
const waters = [];
for (const c of cols) if (c.h < SEA) {
  const w = new THREE.Mesh(new THREE.BoxGeometry(1,.35,1), waterMat);
  w.position.set(c.x+.5, SEA+.82, c.z+.5);
  scene.add(w); waters.push({ m:w, ph:Math.random()*6.28 });
}

// Alberi
const leafT = [], logT = [];
function tree(x, z) {
  const y0 = Math.floor(heightAt(x,z)) + 1;
  const th = 4 + Math.floor(seedRand()*2);
  for (let i=0;i<th;i++) logT.push([x+.5, y0+i+.5, z+.5]);
  for (let dx=-2;dx<=2;dx++) for (let dy=0;dy<=2;dy++) for (let dz=-2;dz<=2;dz++) {
    const r = Math.abs(dx)+Math.abs(dz)+(dy===2?1:0);
    if (r > 3 || (dy===0 && Math.abs(dx)===2 && Math.abs(dz)===2)) continue;
    if (dx===0 && dz===0 && dy<th-1) continue;
    leafT.push([x+.5+dx, y0+th-2+dy+.5, z+.5+dz]);
  }
}
for (const c of cols) {
  if (c.h <= SEA+1 || Math.hypot(c.x,c.z) < 8 || Math.hypot(c.x,c.z) > WORLD_R-4) continue;
  if (seedRand() < .022) tree(c.x, c.z);
}
instanced(leafMat, leafT); instanced(logMat, logT);

// Nuvole quadrate che scorrono
const cloudMat = new THREE.MeshLambertMaterial({ map:TEX.cloud, transparent:true, opacity:.92 });
const clouds = [];
for (let i=0;i<14;i++) {
  const g = new THREE.Group();
  const n = 2 + Math.floor(seedRand()*3);
  for (let j=0;j<n;j++) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(2+seedRand()*3, .8, 2+seedRand()*2), cloudMat);
    b.position.set((seedRand()-.5)*5, 0, (seedRand()-.5)*3);
    g.add(b);
  }
  g.position.set((seedRand()-.5)*70, 16+seedRand()*7, (seedRand()-.5)*70);
  scene.add(g); clouds.push(g);
}

/* ============================================================
   TABELLONE 3x3
============================================================ */
const plankMat = new THREE.MeshLambertMaterial({ map:TEX.plank });
const CELL = 2.1;
const BY = 1.0; // alzata del tabellone sopra il livello del prato
const BASECOL = 0x84868a; // tono neutro delle celle vuote
const cells = [], cellMeshes = [];
for (let r=0;r<3;r++) for (let c=0;c<3;c++) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(CELL*.78, .75, CELL*.78), plankMat.clone());
  m.position.set((c-1)*CELL, .35 + BY, (r-1)*CELL);
  m.material.color.set(BASECOL);
  m.castShadow = m.receiveShadow = true;
  m.userData = { r, c };
  scene.add(m); cells.push(null); cellMeshes.push(m);
}
// fondo scuro che si vede nelle fughe tra le celle: griglia ben leggibile
const gridBase = new THREE.Mesh(new THREE.BoxGeometry(CELL*3.06, .6, CELL*3.06),
  new THREE.MeshLambertMaterial({ color:0x242428 }));
gridBase.position.y = .3 + BY;
gridBase.receiveShadow = true;
scene.add(gridBase);
// pedina-fantasma X mostrata sulla cella sotto il mouse
const ghost = new THREE.Group();
{
  const gm = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:.45, depthWrite:false });
  const bar = new THREE.BoxGeometry(1.5, .4, .4);
  const g1 = new THREE.Mesh(bar, gm), g2 = new THREE.Mesh(bar, gm);
  g1.rotation.z = Math.PI/4; g2.rotation.z = -Math.PI/4;
  ghost.add(g1, g2);
}
ghost.visible = false;
scene.add(ghost);
// Cornice di tronchi attorno al tabellone
const frameMat = new THREE.MeshLambertMaterial({ map:TEX.log });
for (let i=-1;i<=3;i++) for (const [a,b] of [[i,-1],[i,3],[-1,i],[3,i]]) {
  const f = new THREE.Mesh(new THREE.BoxGeometry(CELL, .8, CELL), frameMat);
  f.position.set((a-1)*CELL, .1 + BY, (b-1)*CELL);
  f.castShadow = f.receiveShadow = true;
  scene.add(f);
}
// Base di pietra sotto il tabellone
const base = new THREE.Mesh(new THREE.BoxGeometry(CELL*3.2, .5, CELL*3.2), stoneMat);
base.position.y = BY - .25; base.receiveShadow = true;
scene.add(base);

/* ============================================================
   PEDINE — X (redstone) e O (diamante)
============================================================ */
const xMat = new THREE.MeshLambertMaterial({ map:TEX.red });
const oMat = new THREE.MeshLambertMaterial({ map:TEX.cyan });
const tweens = [];
function spawnPiece(idx, isX) {
  const { r, c } = cellMeshes[idx].userData;
  const g = new THREE.Group();
  if (isX) {
    const bar = new THREE.BoxGeometry(1.5, .4, .4);
    const b1 = new THREE.Mesh(bar, xMat), b2 = new THREE.Mesh(bar, xMat);
    b1.rotation.z =  Math.PI/4; b2.rotation.z = -Math.PI/4;
    b1.castShadow = b2.castShadow = true;
    g.add(b1, b2);
  } else {
    for (let i=0;i<8;i++) {
      const a = i/8 * Math.PI*2;
      const b = new THREE.Mesh(new THREE.BoxGeometry(.42,.4,.42), oMat);
      b.position.set(Math.cos(a)*.62, 0, Math.sin(a)*.62);
      b.rotation.y = -a; b.castShadow = true;
      g.add(b);
    }
  }
  const gy = .95 + BY;
  g.position.set((c-1)*CELL, gy+6, (r-1)*CELL);
  scene.add(g);
  tweens.push({ obj:g, from:gy+6, to:gy, t:0, dur:.32, land:()=> isX ? Sound.placeX() : Sound.placeO() });
  cells[idx] = { group:g, isX };
}
// Piccolo "bounce" quando una pedina atterra
function updateTweens(dt) {
  for (let i=tweens.length-1;i>=0;i--) {
    const tw = tweens[i];
    tw.t = Math.min(1, tw.t + dt/tw.dur);
    const e = 1 - Math.pow(1-tw.t, 3);
    tw.obj.position.y = tw.from + (tw.to-tw.from)*e;
    if (tw.t === 1) {
      tw.obj.position.y = tw.to;
      if (tw.land) tw.land();
      tweens.splice(i,1);
    }
  }
}

/* ============================================================
   LOGICA DI GIOCO
============================================================ */
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let board = Array(9).fill(null);
let turn = 'X', over = false, winLine = null, pcThinking = false;
let score = { X:0, O:0, D:0 };

const statusEl = document.getElementById('status');
const toastEl  = document.getElementById('toast');

function winner(b) {
  for (const L of LINES) if (b[L[0]] && b[L[0]] === b[L[1]] && b[L[1]] === b[L[2]]) return { p:b[L[0]], line:L };
  return b.every(v => v) ? { p:'D' } : null;
}
function minimax(b, isO) { // O = massimizza
  const w = winner(b);
  if (w) return { v: w.p==='O' ? 1 : w.p==='X' ? -1 : 0 };
  let best = { v: isO ? -2 : 2, mv: null };
  for (let i=0;i<9;i++) if (!b[i]) {
    b[i] = isO ? 'O' : 'X';
    const r = minimax(b, !isO);
    b[i] = null;
    if (isO ? r.v > best.v : r.v < best.v) best = { v:r.v, mv:i };
  }
  return best;
}
function pcMove() {
  pcThinking = true;
  statusEl.textContent = 'Il PC sta minando... ⛏';
  setTimeout(() => {
    const empties = board.map((v,i)=>v?null:i).filter(v=>v!==null);
    // 85% mossa ottima, 15% casuale (per non essere impietosi)
    const mv = (Math.random() < .85) ? minimax([...board], true).mv
                                     : empties[Math.floor(Math.random()*empties.length)];
    board[mv] = 'O';
    spawnPiece(mv, false);
    cellMeshes[mv].material.color.set(0x6f9fd8);
    pcThinking = false;
    Sound.pop();
    const w = winner(board);
    if (w) return endGame(w);
    turn = 'X';
    statusEl.textContent = 'Tocca un blocco: tocca a te! (❌)';
  }, 550 + Math.random()*450);
}
function endGame(w) {
  over = true;
  if (w.p === 'D') {
    score.D++; statusEl.textContent = 'Pareggio! 🤝 Nessun vincitore.';
    toast('PAREGGIO!'); Sound.draw();
  } else if (w.p === 'X') {
    score.X++; winLine = w.line; statusEl.textContent = 'HAI VINTO! 🎉 GG!';
    toast('VICTORY!'); Sound.win(); confetti();
  } else {
    score.O++; winLine = w.line; statusEl.textContent = 'Il PC vince... 💀 Riprova!';
    toast('GAME OVER'); Sound.lose();
  }
  updateScore();
  setTimeout(reset, 2800); // auto-reset
}
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 1800);
}
function confetti() {
  const mats = [0xff5252,0xffd740,0x69f0ae,0x40c4ff,0xff4081].map(c => new THREE.MeshLambertMaterial({ color:c }));
  for (let i=0;i<40;i++) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(.22,.22,.22), mats[i%mats.length]);
    b.position.set((Math.random()-.5)*6, 5+Math.random()*3, (Math.random()-.5)*6);
    b.rotation.set(Math.random()*3, Math.random()*3, Math.random()*3);
    scene.add(b);
    tweens.push({ obj:b, from:b.position.y, to:-1.5+Math.random(), t:-(Math.random()*.8), dur:1.6+Math.random(),
                  land:()=>{} , gravity:true });
  }
}
function updateScore() {
  document.getElementById('sX').textContent = score.X;
  document.getElementById('sO').textContent = score.O;
  document.getElementById('sD').textContent = score.D;
}
function reset() {
  tweens.length = 0;
  board.forEach((v,i) => {
    if (v) scene.remove(cells[i].group);
    cells[i] = null;
    cellMeshes[i].material.color.set(BASECOL);
    cellMeshes[i].scale.setScalar(1);
  });
  ghost.visible = false;
  board = Array(9).fill(null);
  turn = 'X'; over = false; winLine = null; pcThinking = false;
  statusEl.textContent = 'Tu sei ❌ — Tocca un blocco per giocare!';
}
document.getElementById('reset').addEventListener('click', () => { Sound.pop(); reset(); });
document.getElementById('mute').addEventListener('click', e => {
  e.target.textContent = Sound.toggle() ? '🔊' : '🔇';
});

/* ============================================================
   INPUT — orbit camera + raycast celle
============================================================ */
let theta = .6, phi = 1.05, dist = 15, dragging = false, lastX = 0, lastY = 0, pinch = 0;
function applyCam() {
  phi = THREE.MathUtils.clamp(phi, .25, 1.45);
  dist = THREE.MathUtils.clamp(dist, 6, 40);
  camera.position.set(
    Math.sin(theta)*Math.sin(phi)*dist,
    Math.cos(phi)*dist + 1.5,
    Math.cos(theta)*Math.sin(phi)*dist
  );
  camera.lookAt(0, .6 + BY, 0);
}
applyCam();
canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; pinch = 0; });
addEventListener('pointerup',   () => dragging = false);
addEventListener('pointermove', e => {
  if (!dragging) return;
  theta -= (e.clientX-lastX)*.005;
  phi   -= (e.clientY-lastY)*.005;
  lastX = e.clientX; lastY = e.clientY;
  applyCam();
});
canvas.addEventListener('wheel', e => { e.preventDefault(); dist += e.deltaY*.01; applyCam(); }, { passive:false });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    if (pinch) dist -= (d-pinch)*.03;
    pinch = d; applyCam();
  }
}, { passive:true });

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let hovered = null;
function pick(e) {
  mouse.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(cellMeshes)[0];
  return hit ? cellMeshes.indexOf(hit.object) : -1;
}
canvas.addEventListener('pointermove', e => {
  if (dragging || over || pcThinking || turn !== 'X') {
    if (hovered!==null){ cellMeshes[hovered].material.color.set(BASECOL); hovered=null; }
    ghost.visible = false; return;
  }
  const i = pick(e);
  if (i >= 0 && !board[i]) {
    if (hovered !== i) {
      Sound.hover();
      if (hovered!==null) cellMeshes[hovered].material.color.set(BASECOL);
    }
    hovered = i;
    cellMeshes[i].material.color.set(0x6fdc7c);
    const { r, c } = cellMeshes[i].userData;
    ghost.position.set((c-1)*CELL, .95 + BY, (r-1)*CELL);
    ghost.visible = true;
  } else if (hovered!==null) {
    cellMeshes[hovered].material.color.set(BASECOL); hovered = null; ghost.visible = false;
  }
});
canvas.addEventListener('click', e => {
  Sound.resume();
  if (over || pcThinking || turn !== 'X' || dragging) return;
  const i = pick(e);
  if (i < 0 || board[i]) return;
  board[i] = 'X';
  ghost.visible = false;
  if (hovered !== null) { cellMeshes[hovered].material.color.set(BASECOL); hovered = null; }
  spawnPiece(i, true);
  cellMeshes[i].material.color.set(0xd86f6f);
  Sound.pop();
  const w = winner(board);
  if (w) return endGame(w);
  turn = 'O';
  pcMove();
});
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================
   LOOP
============================================================ */
const clock = new THREE.Clock();
let loadingHidden = false;
function animate() {
  requestAnimationFrame(animate);
  if (!loadingHidden) {
    loadingHidden = true;
    const l = document.getElementById('loading');
    if (l) l.remove();
  }
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  updateTweens(dt);
  // nuvole alla deriva
  for (const c of clouds) { c.position.x += dt*.55; if (c.position.x > 42) c.position.x = -42; }
  // acqua che ondeggia
  for (const w of waters) w.m.position.y = SEA+.82 + Math.sin(t*1.4 + w.ph)*.06;
  // cella vincente pulsante
  if (winLine) {
    const s = (Math.sin(t*6)+1)/2;
    winLine.forEach(i => cellMeshes[i].material.color.setHSL(.12, .9, .45 + s*.25));
  }
  // celle: leggero ingrandimento quando ci passi sopra con il mouse
  cellMeshes.forEach((m, i) => {
    const target = (i === hovered && !board[i] && !over && !pcThinking && turn === 'X') ? 1.07 : 1;
    m.scale.x += (target - m.scale.x) * .22;
    m.scale.y = m.scale.z = m.scale.x;
  });
  // ghost che ruota lentamente
  ghost.rotation.y = t * 1.1;
  // pedine posate: leggero respiro
  for (const c of cells) if (c) c.group.rotation.y = Math.sin(t*.8)*.04;
  // sway dolce della camera quando ferma
  if (!dragging) { theta += dt*.02; applyCam(); }
  renderer.render(scene, camera);
}
animate();
</script>
