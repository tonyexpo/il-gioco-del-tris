<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tris 3D - stile Minecraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --font: 'Press Start 2P', 'Courier New', monospace; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #c4e0f7;
    font-family: var(--font); color: #fff;
    user-select: none; -webkit-user-select: none;
  }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas#c.hover { cursor: pointer; }
  canvas#c.drag { cursor: grabbing; }

  .hud { position: fixed; pointer-events: none; }
  .panel {
    background: rgba(0, 0, 0, .55); border: 3px solid #000;
    box-shadow: inset 2px 2px 0 rgba(255, 255, 255, .25), inset -2px -2px 0 rgba(0, 0, 0, .4);
    padding: 10px 14px;
  }

  #title {
    top: 12px; left: 50%; transform: translateX(-50%);
    font-size: clamp(24px, 5vw, 46px); letter-spacing: 6px; white-space: nowrap;
    color: #f2f2f2; text-shadow: 4px 4px 0 #3b3b3b;
  }
  #title .x { color: #ff5148; } #title .o { color: #4de3dc; }

  #status {
    top: calc(clamp(24px, 5vw, 46px) + 34px); left: 50%; transform: translateX(-50%);
    font-size: clamp(10px, 1.8vw, 14px); text-align: center; white-space: nowrap;
    text-shadow: 2px 2px 0 #222;
  }
  #status.win  { color: #7dff7d; }
  #status.lose { color: #ff7d6e; }
  #status.draw { color: #ffe27d; }

  #score { top: 12px; left: 12px; font-size: 10px; line-height: 2; text-shadow: 2px 2px 0 #222; }
  #score b { font-weight: normal; }
  #score .x { color: #ff7a72; } #score .o { color: #6df0ea; }

  #controls {
    bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;
    pointer-events: auto; width: max-content; max-width: 96vw;
  }
  .mc-btn {
    font-family: var(--font); font-size: 11px; color: #fff; background: #8b8b8b;
    border: 3px solid #000; padding: 10px 12px; cursor: pointer; text-shadow: 2px 2px 0 #3f3f3f;
    box-shadow: inset 3px 3px 0 #c6c6c6, inset -3px -3px 0 #555; border-radius: 0;
  }
  .mc-btn:hover { background: #7d89cf; box-shadow: inset 3px 3px 0 #b8c1f5, inset -3px -3px 0 #4a528a; }
  .mc-btn:active { transform: translateY(2px); }
  .mc-btn.pulse { animation: pulse 1s steps(2) infinite; }
  @keyframes pulse { 50% { background: #5fbf4f; box-shadow: inset 3px 3px 0 #9be68c, inset -3px -3px 0 #347a29; } }
  select.mc-btn { appearance: none; -webkit-appearance: none; padding-right: 12px; }
  select.mc-btn option { background: #555; color: #fff; }

  #hint { bottom: 76px; left: 50%; transform: translateX(-50%); font-size: 8px; color: #fff; opacity: .85;
          text-shadow: 1px 1px 0 #000; white-space: nowrap; }
  @media (max-width: 640px) { #hint { display: none; } #score { font-size: 8px; } .mc-btn { font-size: 9px; padding: 8px 9px; } }

  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    background: #6b4a2b; color: #fff; font-size: 14px; line-height: 2; z-index: 10; padding: 20px;
    text-shadow: 2px 2px 0 #000; transition: opacity .5s;
  }
  #loading.done { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title" class="hud">TR<span class="x">I</span><span class="o">S</span></div>
<div id="status" class="hud panel">...</div>
<div id="score" class="hud panel">
  <div class="x">TU (X): <b id="sX">0</b></div>
  <div>PAREGGI: <b id="sD">0</b></div>
  <div class="o">PC (O): <b id="sO">0</b></div>
</div>
<div id="hint" class="hud">Trascina: ruota &middot; Rotella: zoom &middot; 1-9: gioca &middot; R: nuova partita &middot; M: suono</div>
<div id="controls" class="hud">
  <select id="diff" class="mc-btn" title="Difficolta del PC">
    <option value="facile">Facile</option>
    <option value="normale" selected>Normale</option>
    <option value="impossibile">Impossibile</option>
  </select>
  <button id="btnNew" class="mc-btn">Nuova partita</button>
  <button id="btnMute" class="mc-btn">Suono: SI</button>
</div>
<div id="loading">Generazione del mondo...</div>

<script type="module">
const $ = s => document.querySelector(s);

let THREE;
try {
  THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
} catch (err) {
  $('#loading').innerHTML = 'Impossibile caricare three.js dal CDN.<br>Controlla la connessione e ricarica la pagina.';
  throw err;
}

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const now = () => performance.now() / 1000;

/* ------------------------------------------------------------------ */
/*  Audio sintetizzato (Web Audio)                                    */
/* ------------------------------------------------------------------ */
let actx = null, master = null, noiseBuf = null, muted = false;

function ensureAudio() {
  try {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = muted ? 0 : 0.55;
      master.connect(actx.destination);
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (actx.state === 'suspended') actx.resume();
    return true;
  } catch (e) { return false; }
}

function tone(f, dur, { type = 'square', vol = 0.15, to = null, delay = 0 } = {}) {
  if (!actx) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + dur + 0.03);
}

function noise(dur, { freq = 800, to = null, vol = 0.3, delay = 0, type = 'lowpass' } = {}) {
  if (!actx) return;
  const t = actx.currentTime + delay;
  const src = actx.createBufferSource();
  src.buffer = noiseBuf; src.loop = true;
  const flt = actx.createBiquadFilter();
  flt.type = type;
  flt.frequency.setValueAtTime(freq, t);
  if (to) flt.frequency.exponentialRampToValueAtTime(to, t + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(flt).connect(g).connect(master);
  src.start(t); src.stop(t + dur + 0.03);
}

const sfx = {
  tick()  { tone(900, 0.04, { type: 'triangle', vol: 0.04, to: 700 }); },
  deny()  { tone(130, 0.12, { type: 'sawtooth', vol: 0.1, to: 90 }); },
  ui()    { tone(520, 0.06, { vol: 0.07 }); tone(780, 0.07, { vol: 0.06, delay: 0.05 }); },
  placeX() {
    noise(0.14, { freq: 900, to: 200, vol: 0.55 });
    tone(150, 0.16, { type: 'sine', vol: 0.4, to: 60 });
    tone(520, 0.08, { vol: 0.05, to: 780 });
  },
  placeO() {
    noise(0.14, { freq: 1200, to: 250, vol: 0.5 });
    tone(190, 0.16, { type: 'sine', vol: 0.4, to: 80 });
    tone(880, 0.08, { vol: 0.05, to: 1180 });
  },
  win() {
    [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, { vol: 0.12, delay: i * 0.12 }));
    [523, 659, 784, 1047].forEach((f) => tone(f, 0.7, { type: 'triangle', vol: 0.09, delay: 0.5 }));
    tone(1568, 0.5, { type: 'triangle', vol: 0.07, delay: 0.6 });
  },
  lose() {
    [392, 330, 262, 196].forEach((f, i) => tone(f, 0.28, { type: 'sawtooth', vol: 0.09, delay: i * 0.22 }));
    noise(0.2, { freq: 3000, type: 'highpass', vol: 0.12, delay: 0.7 });          // sfrigolio
    noise(0.7, { freq: 900, to: 60, vol: 0.9, delay: 0.95 });                      // boom
    tone(70, 0.6, { type: 'sine', vol: 0.5, to: 30, delay: 0.95 });
  },
  draw() {
    tone(330, 0.2, { type: 'triangle', vol: 0.12 });
    tone(294, 0.2, { type: 'triangle', vol: 0.12, delay: 0.2 });
    tone(262, 0.35, { type: 'triangle', vol: 0.12, delay: 0.4 });
  },
  newGame() { tone(392, 0.09, { vol: 0.08 }); tone(523, 0.09, { vol: 0.08, delay: 0.09 }); tone(659, 0.14, { vol: 0.08, delay: 0.18 }); },
};

/* ------------------------------------------------------------------ */
/*  Renderer / scena                                                  */
/* ------------------------------------------------------------------ */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

const HORIZON = 0xc4e0f7;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(HORIZON, 38, 85);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 600);

// cielo a gradiente
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(300, 24, 12),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x4f8fe0) }, hor: { value: new THREE.Color(HORIZON) } },
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 hor; varying vec3 vP; void main(){ float h = normalize(vP).y; float t = pow(clamp(h, 0.0, 1.0), 0.55); gl_FragColor = vec4(mix(hor, top, t), 1.0);\n#include <colorspace_fragment>\n}',
  })
);
sky.renderOrder = -2; sky.frustumCulled = false;
scene.add(sky);

// luci
const sunDir = new THREE.Vector3(-0.45, 0.55, 0.6).normalize();
scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x8a7a5a, 1.5));
const sun = new THREE.DirectionalLight(0xfff0d0, 2.4);
sun.position.copy(sunDir).multiplyScalar(40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 100 });
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

// disco solare (quadrato, come in Minecraft)
const sunDisc = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshBasicMaterial({ color: 0xfff3b0, fog: false }));
sunDisc.frustumCulled = false;
scene.add(sunDisc);

/* ------------------------------------------------------------------ */
/*  Texture procedurali 16x16 stile pixel-art                         */
/* ------------------------------------------------------------------ */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function makeTex(seed, fn) {
  const r = mulberry32(seed);
  const c = document.createElement('canvas');
  c.width = c.height = 16;
  const g = c.getContext('2d');
  const img = g.createImageData(16, 16);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const [R, G, B, A = 255] = fn(x, y, r);
    const k = (y * 16 + x) * 4;
    img.data[k] = clamp(R, 0, 255); img.data[k + 1] = clamp(G, 0, 255);
    img.data[k + 2] = clamp(B, 0, 255); img.data[k + 3] = A;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestMipmapLinearFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
const vary = (base, amt, r, f = 1) => { const k = f * (1 + (r() - 0.5) * amt); return [base[0] * k, base[1] * k, base[2] * k]; };
const edgeOf = (x, y) => (x === 0 || y === 0 || x === 15 || y === 15);

const GRASS = [88, 150, 52], DIRT = [134, 96, 67];
const grassLens = Array.from({ length: 16 }, (_, i) => 3 + Math.floor(mulberry32(i * 77 + 5)() * 3));

const T = {
  grassTop: makeTex(1, (x, y, r) => vary(GRASS, 0.35, r)),
  dirt: makeTex(2, (x, y, r) => vary(DIRT, 0.4, r, r() < 0.1 ? 0.72 : 1)),
  grassSide: makeTex(3, (x, y, r) => y < grassLens[x] ? vary(GRASS, 0.35, r) : vary(DIRT, 0.4, r, r() < 0.1 ? 0.72 : 1)),
  stone: makeTex(4, (x, y, r) => vary([126, 126, 126], 0.28, r, r() < 0.1 ? 0.75 : 1)),
  sand: makeTex(5, (x, y, r) => vary([219, 207, 142], 0.12, r)),
  logSide: makeTex(6, (x, y, r) => vary([104, 82, 50], 0.18, r, x % 4 === 0 ? 0.8 : 1)),
  logTop: makeTex(7, (x, y, r) => {
    const d = Math.max(Math.abs(x - 7.5), Math.abs(y - 7.5));
    if (d > 6.9) return vary([104, 82, 50], 0.15, r);
    return vary(Math.floor(d) % 2 ? [172, 138, 86] : [140, 110, 66], 0.12, r);
  }),
  leaves: makeTex(8, (x, y, r) => {
    const a = r() < 0.14 ? 0 : 255;
    return [...vary([50, 124, 40], 0.55, r), a];
  }),
  water: makeTex(9, (x, y, r) => {
    const streak = ((x * 3 + y * 5) % 11 === 0) || ((x + y * 2) % 13 === 0);
    return streak ? vary([110, 160, 240], 0.15, r) : vary([36, 88, 200], 0.15, r);
  }),
  plankLight: makeTex(10, (x, y, r) => vary([214, 196, 142], 0.1, r, y % 4 === 3 ? 0.82 : 1)),
  plankDark: makeTex(11, (x, y, r) => vary([112, 82, 50], 0.1, r, y % 4 === 3 ? 0.78 : 1)),
  cobble: makeTex(12, (x, y, r) => vary([92, 92, 92], 0.5, r, ((x >> 2) + (y >> 2)) % 2 ? 0.85 : 1.05)),
  red: makeTex(13, (x, y, r) => vary([206, 44, 38], 0.3, r, edgeOf(x, y) ? 0.72 : 1)),
  diamond: makeTex(14, (x, y, r) => r() < 0.1 ? [235, 255, 255] : vary([70, 212, 206], 0.2, r, edgeOf(x, y) ? 0.78 : 1)),
};
for (const k of ['plankLight', 'plankDark']) { T[k].wrapS = T[k].wrapT = THREE.RepeatWrapping; T[k].repeat.set(2, 2); }
T.cobble.wrapS = T.cobble.wrapT = THREE.RepeatWrapping; T.cobble.repeat.set(7, 7);
T.water.wrapS = T.water.wrapT = THREE.RepeatWrapping; T.water.repeat.set(600, 600);

const lam = (map, extra = {}) => new THREE.MeshLambertMaterial({ map, ...extra });

/* ------------------------------------------------------------------ */
/*  Mondo voxel                                                       */
/* ------------------------------------------------------------------ */
const HALF = 44;      // il mondo va da -HALF a +HALF
const SEA = -2;       // altezza (blocco) del livello del mare
const SEED = 20260;

function hash(x, z) {
  let h = Math.imul(x, 374761393) + Math.imul(z, 668265263) + SEED;
  h = Math.imul(h ^ h >>> 13, 1274126177);
  return ((h ^ h >>> 16) >>> 0) / 4294967296;
}
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function heightAt(x, z) {
  const n = 0.55 * vnoise(x / 10, z / 10) + 0.3 * vnoise(x / 4.5 + 50, z / 4.5) + 0.15 * vnoise(x / 2 + 9, z / 2 - 30);
  let h = n * 11 - 4.5;
  const t = clamp((Math.hypot(x, z) - 6.5) / 9, 0, 1);       // piattaforma piatta al centro
  h *= t * (1 + 0.6 * t);
  const e = clamp((Math.max(Math.abs(x), Math.abs(z)) - (HALF - 12)) / 10, 0, 1);   // bordo -> oceano
  h = h * (1 - e) + (-5) * e;
  return Math.round(h);
}

const lists = { grass: [], dirt: [], sand: [], stone: [], log: [], leaf: [] };
for (let x = -HALF; x <= HALF; x++) for (let z = -HALF; z <= HALF; z++) {
  const h = heightAt(x, z);
  const minN = Math.min(heightAt(x + 1, z), heightAt(x - 1, z), heightAt(x, z + 1), heightAt(x, z - 1));
  const lo = Math.min(minN + 1, h);
  for (let y = h; y >= lo; y--) {
    let type;
    if (h <= -1) type = 'sand';
    else if (y === h) type = 'grass';
    else type = y >= h - 2 ? 'dirt' : 'stone';
    lists[type].push([x, y, z]);
  }
}

// alberi
const rng = mulberry32(4242);
const trees = [];
for (let x = -HALF + 4; x <= HALF - 4; x++) for (let z = -HALF + 4; z <= HALF - 4; z++) {
  if (Math.hypot(x, z) < 9) continue;
  const h = heightAt(x, z);
  if (h < 0 || h > 4 || rng() > 0.022) continue;
  if (trees.some(t => Math.hypot(t[0] - x, t[1] - z) < 4)) continue;
  trees.push([x, z]);
  const th = 4 + Math.floor(rng() * 2);
  for (let y = 1; y <= th; y++) lists.log.push([x, h + y, z]);
  const seen = new Set();
  for (let dy = th - 1; dy <= th + 1; dy++) {
    const rad = dy === th + 1 ? 1 : 2;
    for (let dx = -rad; dx <= rad; dx++) for (let dz = -rad; dz <= rad; dz++) {
      if (dx === 0 && dz === 0 && dy <= th) continue;
      if (Math.abs(dx) === 2 && Math.abs(dz) === 2 && rng() < 0.6) continue;
      lists.leaf.push([x + dx, h + dy, z + dz]);
    }
  }
}

function makeInst(geo, mat, list, shadow = true) {
  if (!list.length) return null;
  const m = new THREE.InstancedMesh(geo, mat, list.length);
  const d = new THREE.Object3D();
  list.forEach((p, i) => { d.position.set(p[0], p[1], p[2]); d.updateMatrix(); m.setMatrixAt(i, d.matrix); });
  m.instanceMatrix.needsUpdate = true;
  m.castShadow = shadow; m.receiveShadow = true;
  scene.add(m);
  return m;
}
const blockGeo = new THREE.BoxGeometry(1, 1, 1);
const mDirt = lam(T.dirt);
makeInst(blockGeo, [lam(T.grassSide), lam(T.grassSide), lam(T.grassTop), mDirt, lam(T.grassSide), lam(T.grassSide)], lists.grass);
makeInst(blockGeo, mDirt, lists.dirt);
makeInst(blockGeo, lam(T.sand), lists.sand);
makeInst(blockGeo, lam(T.stone), lists.stone);
makeInst(blockGeo, [lam(T.logSide), lam(T.logSide), lam(T.logTop), lam(T.logTop), lam(T.logSide), lam(T.logSide)], lists.log);
makeInst(blockGeo, lam(T.leaves, { alphaTest: 0.5 }), lists.leaf);

// fiori
{
  const fr = mulberry32(99), stems = [], heads = [], colors = [];
  const palette = [0xe03b3b, 0xf2d13a, 0xffffff, 0xd96bd9, 0x4f8fe0, 0xff9a2e];
  for (let x = -HALF + 6; x <= HALF - 6; x++) for (let z = -HALF + 6; z <= HALF - 6; z++) {
    if (Math.hypot(x, z) < 4.5 || fr() > 0.035) continue;
    const h = heightAt(x, z);
    if (h < 0) continue;
    // niente fiori sotto un tronco/foglia
    if (trees.some(t => Math.abs(t[0] - x) < 3 && Math.abs(t[1] - z) < 3)) continue;
    const ox = (fr() - 0.5) * 0.5, oz = (fr() - 0.5) * 0.5;
    stems.push([x + ox, h + 0.5 + 0.15, z + oz]);
    heads.push([x + ox, h + 0.5 + 0.34, z + oz]);
    colors.push(palette[Math.floor(fr() * palette.length)]);
  }
  const stemMesh = makeInst(new THREE.BoxGeometry(0.08, 0.3, 0.08), new THREE.MeshLambertMaterial({ color: 0x3f8a2e }), stems, false);
  const headMesh = makeInst(new THREE.BoxGeometry(0.22, 0.14, 0.22), new THREE.MeshLambertMaterial({ color: 0xffffff }), heads, false);
  if (headMesh) { const c = new THREE.Color(); colors.forEach((hex, i) => headMesh.setColorAt(i, c.setHex(hex))); headMesh.instanceColor.needsUpdate = true; }
}

// acqua + fondale oceanico
T.water.userData = {};
const waterMat = new THREE.MeshLambertMaterial({ map: T.water, transparent: true, opacity: 0.78, depthWrite: false });
const water = new THREE.Mesh(new THREE.PlaneGeometry(700, 700), waterMat);
water.rotation.x = -Math.PI / 2;
water.position.y = SEA + 0.5 - 0.12;
water.receiveShadow = true;
scene.add(water);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(700, 700), new THREE.MeshLambertMaterial({ color: 0xb8a878 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -5.6;
scene.add(floor);

// nuvole
const clouds = [];
{
  const cr = mulberry32(777);
  const cm = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.92 });
  for (let i = 0; i < 16; i++) {
    const g = new THREE.Group();
    const parts = 3 + Math.floor(cr() * 4);
    for (let k = 0; k < parts; k++) {
      const w = 4 * (1 + Math.floor(cr() * 3)), d = 4 * (1 + Math.floor(cr() * 2));
      const b = new THREE.Mesh(new THREE.BoxGeometry(w, 1.6, d), cm);
      b.position.set(k * 3.5 - parts * 1.7, (cr() - 0.5) * 0.6, (cr() - 0.5) * 6);
      g.add(b);
    }
    g.position.set((cr() - 0.5) * 140, 22 + cr() * 8, (cr() - 0.5) * 140);
    g.userData.speed = 0.6 + cr() * 0.8;
    clouds.push(g); scene.add(g);
  }
}

/* ------------------------------------------------------------------ */
/*  Tabellone                                                         */
/* ------------------------------------------------------------------ */
const GAP = 2.2;
const SLAB_TOP = 1.0;
const cellPos = i => new THREE.Vector3(((i % 3) - 1) * GAP, SLAB_TOP, (Math.floor(i / 3) - 1) * GAP);

const frame = new THREE.Mesh(new THREE.BoxGeometry(7, 0.2, 7), lam(T.cobble));
frame.position.y = 0.6; frame.receiveShadow = true; frame.castShadow = true;
scene.add(frame);

const slabGeo = new THREE.BoxGeometry(2, 0.3, 2);
const slabs = [], slabMats = [];
for (let i = 0; i < 9; i++) {
  const mat = lam(((i % 3) + Math.floor(i / 3)) % 2 ? T.plankDark : T.plankLight);
  const m = new THREE.Mesh(slabGeo, mat);
  const p = cellPos(i);
  m.position.set(p.x, SLAB_TOP - 0.15, p.z);
  m.receiveShadow = true; m.castShadow = true;
  m.userData.i = i;
  scene.add(m); slabs.push(m); slabMats.push(mat);
}

// torce agli angoli
const torches = [];
{
  const stick = new THREE.BoxGeometry(0.12, 0.7, 0.12), tip = new THREE.BoxGeometry(0.18, 0.18, 0.18);
  const stickMat = new THREE.MeshLambertMaterial({ color: 0x6b4a26 });
  const tipMat = new THREE.MeshBasicMaterial({ color: 0xffb030 });
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz], k) => {
    const g = new THREE.Group();
    const s = new THREE.Mesh(stick, stickMat); s.position.y = 0.35; s.castShadow = true;
    const t = new THREE.Mesh(tip, tipMat); t.position.y = 0.78;
    const l = new THREE.PointLight(0xffa040, 12, 9, 2); l.position.y = 0.95;
    g.add(s, t, l);
    g.position.set(sx * 3.35, 0.7, sz * 3.35);
    scene.add(g);
    torches.push({ tip: t, light: l, k });
  });
}

/* ------------------------------------------------------------------ */
/*  Pezzi X / O fatti di cubetti                                      */
/* ------------------------------------------------------------------ */
const CUBE = 0.3;
const X_CELLS = [], O_CELLS = [];
for (let i = 0; i < 5; i++) for (let j = 0; j < 5; j++) {
  if (i === j || i + j === 4) X_CELLS.push([i, j]);
  const edge = i === 0 || i === 4 || j === 0 || j === 4;
  const corner = (i === 0 || i === 4) && (j === 0 || j === 4);
  if (edge && !corner) O_CELLS.push([i, j]);
}
const cubeGeo = new THREE.BoxGeometry(CUBE, CUBE, CUBE);
function buildPiece(sym, mat) {
  const g = new THREE.Group();
  for (const [i, j] of (sym === 'X' ? X_CELLS : O_CELLS)) for (let k = 0; k < 2; k++) {
    const m = new THREE.Mesh(cubeGeo, mat);
    m.position.set((i - 2) * CUBE, (k + 0.5) * CUBE, (j - 2) * CUBE);
    m.castShadow = true;
    g.add(m);
  }
  return g;
}
const pieceMat = sym => new THREE.MeshLambertMaterial({ map: sym === 'X' ? T.red : T.diamond });

// "fantasma" di anteprima della X
const ghostMat = new THREE.MeshLambertMaterial({ map: T.red, transparent: true, opacity: 0.4, depthWrite: false });
const ghost = buildPiece('X', ghostMat);
ghost.traverse(o => { o.castShadow = false; });
ghost.visible = false;
scene.add(ghost);

/* ------------------------------------------------------------------ */
/*  Particelle                                                        */
/* ------------------------------------------------------------------ */
const particles = [];
const pGeo = new THREE.BoxGeometry(1, 1, 1);
const pMats = new Map();
const pMat = c => { let m = pMats.get(c); if (!m) { m = new THREE.MeshLambertMaterial({ color: c, emissive: c, emissiveIntensity: 0.25 }); pMats.set(c, m); } return m; };

function burst(pos, n, colors, { speed = 2.5, up = 3, size = 0.12, life = 1, spread = 0.4 } = {}) {
  const t = now();
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(pGeo, pMat(colors[Math.floor(Math.random() * colors.length)]));
    const s = size * (0.6 + Math.random() * 0.8);
    m.scale.setScalar(s);
    m.position.set(pos.x + (Math.random() - 0.5) * spread * 2, pos.y, pos.z + (Math.random() - 0.5) * spread * 2);
    scene.add(m);
    particles.push({
      m, s, born: t, life: life * (0.7 + Math.random() * 0.6),
      vel: new THREE.Vector3((Math.random() - 0.5) * speed * 2, up * (0.5 + Math.random()), (Math.random() - 0.5) * speed * 2),
    });
  }
}
function updateParticles(dt, t) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const age = (t - p.born) / p.life;
    if (age >= 1) { scene.remove(p.m); particles.splice(i, 1); continue; }
    p.vel.y -= 14 * dt;
    p.m.position.addScaledVector(p.vel, dt);
    const onBoard = Math.abs(p.m.position.x) < 3.5 && Math.abs(p.m.position.z) < 3.5;
    const floorY = (onBoard ? 1.0 : 0.5) + p.s / 2;
    if (p.m.position.y < floorY && p.vel.y < 0) { p.m.position.y = floorY; p.vel.y *= -0.3; p.vel.x *= 0.7; p.vel.z *= 0.7; }
    p.m.rotation.x += dt * 5; p.m.rotation.z += dt * 4;
    p.m.scale.setScalar(p.s * (1 - age * age));
  }
}

/* ------------------------------------------------------------------ */
/*  Logica di gioco                                                   */
/* ------------------------------------------------------------------ */
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const winnerOf = b => { for (const l of LINES) if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return { w: b[l[0]], line: l }; return null; };

function minimax(b, isO, depth) {
  const r = winnerOf(b);
  if (r) return r.w === 'O' ? 10 - depth : depth - 10;
  if (b.every(Boolean)) return 0;
  let best = isO ? -Infinity : Infinity;
  for (let i = 0; i < 9; i++) if (!b[i]) {
    b[i] = isO ? 'O' : 'X';
    const s = minimax(b, !isO, depth + 1);
    b[i] = null;
    best = isO ? Math.max(best, s) : Math.min(best, s);
  }
  return best;
}
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const emptyCells = b => b.map((v, i) => v ? -1 : i).filter(i => i >= 0);

function bestMove(b) {
  if (b.every(v => !v)) return pick([0, 2, 4, 6, 8]);
  let best = -Infinity, moves = [];
  for (const i of emptyCells(b)) {
    b[i] = 'O';
    const s = minimax(b, false, 1);
    b[i] = null;
    if (s > best) { best = s; moves = [i]; } else if (s === best) moves.push(i);
  }
  return pick(moves);
}
function findLineMove(b, sym) {
  for (const i of emptyCells(b)) {
    b[i] = sym;
    const w = winnerOf(b);
    b[i] = null;
    if (w) return i;
  }
  return -1;
}
function chooseMove(b, level) {
  const empties = emptyCells(b);
  if (level === 'impossibile') return bestMove(b);
  if (level === 'facile') return Math.random() < 0.25 ? bestMove(b) : pick(empties);
  // normale: vince se puo', blocca se serve, altrimenti istinto (centro / casuale)
  let m = findLineMove(b, 'O'); if (m >= 0) return m;
  m = findLineMove(b, 'X'); if (m >= 0) return m;
  if (!b[4] && Math.random() < 0.6) return 4;
  return pick(empties);
}

/* ---- stato ---- */
let board, over, turn, starter = 'X', gameId = 0, winLine = null, hoverCell = -1;
const pieces = new Array(9).fill(null);
const scores = { X: 0, O: 0, D: 0 };
let shake = { until: 0, dur: 1, mag: 0 };

const statusEl = $('#status'), diffEl = $('#diff'), btnNew = $('#btnNew'), btnMute = $('#btnMute');
try { const d = localStorage.getItem('tris-diff'); if (d) diffEl.value = d; } catch (e) {}
function setStatus(txt, cls = '') { statusEl.textContent = txt; statusEl.className = 'hud panel ' + cls; }
function updateScore() { $('#sX').textContent = scores.X; $('#sO').textContent = scores.O; $('#sD').textContent = scores.D; }

function clearBoard() {
  pieces.forEach((p, i) => { if (p) { scene.remove(p.g); p.mat.dispose(); pieces[i] = null; } });
  slabMats.forEach(m => { m.emissive.setHex(0x000000); m.emissiveIntensity = 1; });
}

function newGame() {
  if (over) starter = starter === 'X' ? 'O' : 'X';
  gameId++;
  clearBoard();
  board = new Array(9).fill(null);
  over = false; winLine = null; hoverCell = -1; ghost.visible = false;
  btnNew.classList.remove('pulse');
  turn = starter;
  if (turn === 'X') setStatus('Tocca a te: gioca la X');
  else pcTurn();
}

function placePiece(sym, i) {
  const mat = pieceMat(sym);
  const g = buildPiece(sym, mat);
  const p = cellPos(i);
  g.position.set(p.x, p.y + 3, p.z);
  scene.add(g);
  pieces[i] = { g, mat, t0: now(), baseY: p.y, sym };
  board[i] = sym;
  const id = gameId;
  setTimeout(() => {                      // impatto sul blocco
    if (id !== gameId) return;
    sym === 'X' ? sfx.placeX() : sfx.placeO();
    burst(p, 10, [0xdddddd, 0xbbbbbb, 0x999999, sym === 'X' ? 0xcc3a30 : 0x46d0ca], { speed: 1.6, up: 1.8, size: 0.1, life: 0.7, spread: 0.7 });
  }, 180);
}

function afterMove() {
  const r = winnerOf(board);
  if (r) return finish(r.w, r.line);
  if (board.every(Boolean)) return finish('D', null);
  turn = turn === 'X' ? 'O' : 'X';
  if (turn === 'O') pcTurn(); else setStatus('Tocca a te: gioca la X');
}

function pcTurn() {
  setStatus('Il PC sta pensando...');
  const id = gameId;
  setTimeout(() => {
    if (id !== gameId || over) return;
    const i = chooseMove(board.slice(), diffEl.value);
    placePiece('O', i);
    afterMove();
  }, 650 + Math.random() * 450);
}

function playerMove(i) {
  ensureAudio();
  if (over || turn !== 'X') return;
  if (board[i]) { sfx.deny(); return; }
  setHover(-1);
  placePiece('X', i);
  afterMove();
}

function finish(res, line) {
  over = true; winLine = line; ghost.visible = false;
  scores[res]++; updateScore();
  btnNew.classList.add('pulse');
  const id = gameId;
  const later = (fn, ms) => setTimeout(() => { if (id === gameId) fn(); }, ms);
  if (res === 'X') {
    setStatus('Hai vinto!', 'win');
    later(() => sfx.win(), 450);
    const c = cellPos(4);
    const cols = [0xff5148, 0xffe27d, 0x7dff7d, 0x6df0ea, 0xffffff, 0xd96bd9];
    [500, 900, 1300].forEach(ms => later(() => burst(new THREE.Vector3(c.x, 1.5, c.z), 60, cols, { speed: 3.2, up: 7, size: 0.14, life: 2.2, spread: 2 }), ms));
  } else if (res === 'O') {
    setStatus('Ha vinto il PC!', 'lose');
    later(() => sfx.lose(), 450);
    later(() => {
      shake = { until: now() + 0.6, dur: 0.6, mag: 0.45 };
      line.forEach(i => burst(cellPos(i), 30, [0x4a4a4a, 0x2f2f2f, 0x5fae4f, 0x8a8a8a, 0xff8a2e], { speed: 2.8, up: 5, size: 0.16, life: 1.4, spread: 0.6 }));
    }, 1400);
  } else {
    setStatus('Pareggio!', 'draw');
    later(() => sfx.draw(), 400);
  }
}

/* ------------------------------------------------------------------ */
/*  Hover / input                                                     */
/* ------------------------------------------------------------------ */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function pickCell(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(slabs, false)[0];
  return hit ? hit.object.userData.i : -1;
}
const canHover = i => i >= 0 && !over && turn === 'X' && !board[i];

function setHover(i) {
  if (!canHover(i)) i = -1;
  if (i === hoverCell) return;
  if (hoverCell >= 0 && !(winLine && winLine.includes(hoverCell))) slabMats[hoverCell].emissive.setHex(0x000000);
  hoverCell = i;
  if (i >= 0) {
    slabMats[i].emissive.setHex(0x3a3a3a);
    ghost.position.copy(cellPos(i)); ghost.visible = true;
    sfx.tick();
  } else ghost.visible = false;
  canvas.classList.toggle('hover', i >= 0);
}

let tgtAz = 0.35, tgtPhi = 1.0, tgtR = 13, az = tgtAz, phi = tgtPhi, rad = tgtR;
let dragging = false, moved = false, lastX = 0, lastY = 0, startX = 0, startY = 0;

canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  dragging = true; moved = false;
  lastX = startX = e.clientX; lastY = startY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add('drag');
});
canvas.addEventListener('pointermove', e => {
  if (dragging) {
    if (Math.hypot(e.clientX - startX, e.clientY - startY) > 6) moved = true;
    if (moved) {
      tgtAz -= (e.clientX - lastX) * 0.006;
      tgtPhi = clamp(tgtPhi - (e.clientY - lastY) * 0.005, 0.35, 1.38);
    }
    lastX = e.clientX; lastY = e.clientY;
    setHover(-1);
  } else if (e.pointerType === 'mouse') setHover(pickCell(e));
});
canvas.addEventListener('pointerup', e => {
  dragging = false;
  canvas.classList.remove('drag');
  if (!moved) { const i = pickCell(e); if (i >= 0) playerMove(i); }
});
canvas.addEventListener('pointercancel', () => { dragging = false; canvas.classList.remove('drag'); });
canvas.addEventListener('pointerleave', () => { if (!dragging) setHover(-1); });
canvas.addEventListener('wheel', e => { e.preventDefault(); tgtR = clamp(tgtR + e.deltaY * 0.01, 7, 24); }, { passive: false });

btnNew.addEventListener('click', () => { ensureAudio(); sfx.newGame(); newGame(); });
diffEl.addEventListener('change', () => { ensureAudio(); sfx.ui(); try { localStorage.setItem('tris-diff', diffEl.value); } catch (e) {} diffEl.blur(); });
function toggleMute() {
  ensureAudio();
  muted = !muted;
  if (master) master.gain.value = muted ? 0 : 0.55;
  btnMute.textContent = 'Suono: ' + (muted ? 'NO' : 'SI');
  if (!muted) sfx.ui();
}
btnMute.addEventListener('click', () => { toggleMute(); btnMute.blur(); });
window.addEventListener('keydown', e => {
  if (e.target === diffEl) return;
  if (e.key >= '1' && e.key <= '9') playerMove(+e.key - 1);
  else if (e.key === 'r' || e.key === 'R') { ensureAudio(); sfx.newGame(); newGame(); }
  else if (e.key === 'm' || e.key === 'M') toggleMute();
});

/* ------------------------------------------------------------------ */
/*  Loop                                                              */
/* ------------------------------------------------------------------ */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = camera.aspect < 1 ? 75 : 55;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

const easeOutBounce = x => {
  const n1 = 7.5625, d1 = 2.75;
  if (x < 1 / d1) return n1 * x * x;
  if (x < 2 / d1) return n1 * (x -= 1.5 / d1) * x + 0.75;
  if (x < 2.5 / d1) return n1 * (x -= 2.25 / d1) * x + 0.9375;
  return n1 * (x -= 2.625 / d1) * x + 0.984375;
};

const target = new THREE.Vector3(0, 0.9, 0);
let last = now();
function frame_() {
  const t = now(), dt = Math.min(0.05, t - last);
  last = t;

  // camera orbitale con smorzamento + leggero dondolio
  const k = Math.min(1, dt * 8);
  az += (tgtAz - az) * k; phi += (tgtPhi - phi) * k; rad += (tgtR - rad) * k;
  const a = az + Math.sin(t * 0.15) * 0.04;
  camera.position.set(
    target.x + rad * Math.sin(phi) * Math.sin(a),
    target.y + rad * Math.cos(phi),
    target.z + rad * Math.sin(phi) * Math.cos(a));
  if (t < shake.until) {
    const s = shake.mag * (shake.until - t) / shake.dur;
    camera.position.x += (Math.random() - 0.5) * s; camera.position.y += (Math.random() - 0.5) * s;
  }
  camera.lookAt(target);

  sky.position.copy(camera.position);
  sunDisc.position.copy(camera.position).addScaledVector(sunDir, 220);
  sunDisc.lookAt(camera.position);

  // acqua che scorre, nuvole che passano
  T.water.offset.x += dt * 0.03; T.water.offset.y += dt * 0.015;
  for (const c of clouds) { c.position.x += c.userData.speed * dt; if (c.position.x > 90) c.position.x = -90; }

  // torce
  for (const o of torches) {
    const f = 0.8 + 0.2 * Math.sin(t * 13 + o.k * 2) + (Math.random() - 0.5) * 0.15;
    o.light.intensity = 12 * f; o.tip.scale.setScalar(0.85 + 0.15 * f);
  }

  // pezzi: caduta con rimbalzo, poi animazione di vittoria
  for (let i = 0; i < 9; i++) {
    const p = pieces[i];
    if (!p) continue;
    const prog = (t - p.t0) / 0.5;
    const winning = winLine && winLine.includes(i);
    let y = p.baseY + (prog < 1 ? (1 - easeOutBounce(Math.max(0, prog))) * 3 : 0);
    if (winning && prog >= 1) {
      y += 0.2 + 0.2 * Math.sin(t * 5 + i * 0.9);
      p.g.rotation.y += dt * 1.6;
      p.mat.emissive.setHex(0xffcc33); p.mat.emissiveIntensity = 0.3 + 0.25 * Math.sin(t * 6);
      slabMats[i].emissive.setHex(0x2a7a2a); slabMats[i].emissiveIntensity = 0.6 + 0.4 * Math.sin(t * 6);
    }
    p.g.position.y = y;
  }
  // il fantasma pulsa leggermente
  if (ghost.visible) ghostMat.opacity = 0.3 + 0.15 * Math.sin(t * 6);

  updateParticles(dt, t);
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame_);

updateScore();
newGame();
$('#loading').classList.add('done');
</script>
