<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe - Human vs AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container">
  <h1>Tic-Tac-Toe 🎮</h1>
  <p class="subtitle">Umano X vs PC O — grafica Minecraft blocchi</p>

  <!-- Game Board -->
  <div id="board"></div>

  <!-- Messages -->
  <div id="message" class="hidden"></div>

  <!-- Controls -->
  <div class="controls">
    <button id="resetBtn">Reset</button>
    <span class="instruction">(seleziona X o O n la prima cella)</span>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
